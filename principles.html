<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}</style>
<title>UI 원칙</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=DotGothic16&display=swap">
<style>
/* Layout: 설계 도면 느낌. 카드마다 8px 격자 위에 실제 UI 조각 두 개를 나란히 놓고, 비교 기준은 레드라인 색으로 표시 */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --ink:#15171d; --muted:#5e6371; --line:#dcdfe6; --red:#d9346a; --grid:rgba(21,23,29,.06);
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101216;--surface:#191c22;--ink:#eceef2;--muted:#9ba1ae;--line:#2a2e37;--red:#ff6d98;--grid:rgba(236,238,242,.06);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--surface:#191c22;--ink:#eceef2;--muted:#9ba1ae;--line:#2a2e37;--red:#ff6d98;--grid:rgba(236,238,242,.06);color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1160px;margin:0 auto;padding-block:44px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,7vw,60px);line-height:1;margin:0 0 12px;letter-spacing:-.01em}
header h1 span{color:var(--red)}
header p{color:var(--muted);margin:0;max-width:60ch}
nav.cats{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 6px}
nav.cats a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:4px 12px;border-radius:4px;background:var(--surface)}
nav.cats a:hover,nav.cats a:focus-visible{border-color:var(--red);outline:none}
h2{font-family:var(--display);font-weight:400;font-size:30px;margin:52px 0 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
h2 small{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-size:19px;font-weight:700;line-height:1.3}
.card h3 .en{display:block;font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
figcaption{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
figcaption b{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink)}
figure.after figcaption b{color:var(--red)}
.card p{margin:0;font-size:14px}
.tip{font-size:13px;color:var(--muted)}
.tip strong{color:var(--ink);font-weight:500}
footer{margin-top:60px;color:var(--muted);font-size:13px}

/* ---- 예시 무대: 8px 격자 위의 작은 화면. 안쪽 UI는 테마와 상관없이 같은 밝은 화면으로 보여 준다 ---- */
.stage{--mbg:#eef0f4;--msf:#ffffff;--mink:#1f2430;--mmut:#6b7080;--mln:#d6d9e1;--mpri:#3b5bdb;--mgold:#c98a10;--mred:#e5484d;--mgrn:#2f9e44;
  position:relative;aspect-ratio:4/3;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:8px 8px;
  font-family:var(--body);font-size:12px;line-height:1.4;color:var(--mink)}
.mock{position:absolute;left:0;top:0;width:280px;height:210px;transform-origin:0 0;transform:scale(var(--s,1))}
.scr{position:absolute;inset:10px;background:var(--mbg);border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--mln)}
.stage .btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:5px 12px;border-radius:6px;border:0;background:var(--mpri);color:#fff;font:600 12px/1.3 var(--body);cursor:pointer;transition:filter .15s,transform .1s}
.stage .btn:hover{filter:brightness(1.12)}.stage .btn:active{transform:translateY(1px)}
.stage .btn.ghost{background:transparent;color:var(--mpri);box-shadow:inset 0 0 0 1.5px var(--mpri)}
.stage .btn:focus-visible{outline:2px solid var(--mred);outline-offset:2px}
.panel{background:var(--msf);border-radius:6px;box-shadow:0 1px 2px rgba(20,24,40,.12)}
.mut{color:var(--mmut)}
.guide{position:absolute;pointer-events:none;border:0 dashed var(--red)}
.redfill{background:color-mix(in srgb,var(--red) 16%,transparent)}
.ico{width:16px;height:16px;flex:none;display:inline-block}
@keyframes rz{0%,14%{right:10px}48%,64%{right:44%}100%{right:10px}}
@keyframes wide{0%,14%{left:28%;right:28%}48%,64%{left:6%;right:6%}100%{left:28%;right:28%}}
@keyframes stretch{0%,14%{transform:scaleX(1)}48%,64%{transform:scaleX(1.95)}100%{transform:scaleX(1)}}

@keyframes fring{0%,30%{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--mred)}34%,100%{box-shadow:none}}
@keyframes toast{0%,8%{transform:translate(-50%,36px);opacity:0}16%,70%{transform:translate(-50%,0);opacity:1}80%,100%{transform:translate(-50%,0);opacity:0}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes prog{0%{width:0}85%,100%{width:100%}}
@keyframes drag{0%,12%{transform:translate(0,0)}52%,100%{transform:translate(132px,0)}}
@keyframes lift{0%,12%{box-shadow:0 1px 2px rgba(20,24,40,.15);transform:scale(1)}16%,48%{box-shadow:0 8px 14px rgba(20,24,40,.3);transform:scale(1.1)}52%,100%{box-shadow:0 1px 2px rgba(20,24,40,.15);transform:scale(1)}}
@keyframes slotlit{0%,30%{box-shadow:inset 0 0 0 1.5px var(--mln);background:var(--msf)}36%,50%{box-shadow:inset 0 0 0 2px var(--mpri);background:#e7ecff}54%,100%{box-shadow:inset 0 0 0 1.5px var(--mln);background:var(--msf)}}
@keyframes ghost{0%,12%{opacity:0}16%,50%{opacity:.35}54%,100%{opacity:0}}
@keyframes press{0%,60%{transform:scale(1)}66%{transform:scale(.88)}74%{transform:scale(1.1)}82%,100%{transform:scale(1)}}
@keyframes plain{0%,62%{transform:none}64%,70%{transform:translateY(1px)}72%,100%{transform:none}}
@keyframes floatup{0%,64%{opacity:0;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}
@keyframes hpnow{0%,22%{width:100%}24%,100%{width:58%}}
@keyframes hptrail{0%,34%{width:100%}72%,100%{width:58%}}
@keyframes hit{0%,22%{transform:none}24%{transform:translateX(-2px)}26%{transform:translateX(2px)}28%,100%{transform:none}}
@property --cd{syntax:'<number>';inherits:false;initial-value:0}
@keyframes cd{0%{--cd:1}100%{--cd:0}}
.itm{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;position:relative;flex:none}
.itm .n{position:absolute;right:2px;bottom:0;font:700 9px/1.2 var(--mono);color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.dot{position:absolute;top:-3px;right:-3px;min-width:9px;height:9px;border-radius:9px;background:var(--mred);box-shadow:0 0 0 1.5px var(--msf);font:700 8px/9px var(--body);color:#fff;text-align:center;padding:0 2px}
@font-face{font-family:'DNFBitBitv2';src:url('fonts/DNFBitBitv2.woff2') format('woff2');font-weight:400;font-display:swap}
/* 게임 화면 속 글자는 던파 비트비트체 v2(ⓒ NEOPLE)로. 굵기가 하나뿐이라 가짜 굵게는 끈다 */
.card.ingame .mock,.mock .gamebg{--body:'DNFBitBitv2','Noto Sans KR',sans-serif;--mono:'DNFBitBitv2',monospace;font-family:var(--body);font-synthesis:none;-webkit-font-smoothing:none}
.gamebg{position:absolute;inset:10px;border-radius:6px;overflow:hidden;background:linear-gradient(#7fb2e0 0 55%,#6a9a4a 55% 100%)}

@keyframes slidelin{0%,15%{transform:translateX(-110%)}45%,85%{transform:translateX(0)}100%{transform:translateX(-110%)}}
@keyframes popin{0%,15%{transform:translateX(-110%)}38%{transform:translateX(6%)}45%,85%{transform:translateX(0)}100%{transform:translateX(-110%)}}
@keyframes appear{0%,10%{opacity:0;transform:translateY(8px)}16%,85%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}
@keyframes cutA{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes cutB{0%,49.9%{opacity:0}50%,100%{opacity:1}}
@keyframes pushA{0%,40%{transform:translateX(0)}50%,90%{transform:translateX(-105%)}100%{transform:translateX(0)}}
@keyframes pushB{0%,40%{transform:translateX(105%)}50%,90%{transform:translateX(0)}100%{transform:translateX(105%)}}
@keyframes scrollstop{0%,10%{transform:translateY(0)}45%,80%{transform:translateY(-96px)}100%{transform:translateY(0)}}
@keyframes scrollbounce{0%,10%{transform:translateY(0)}38%{transform:translateY(-112px)}46%{transform:translateY(-92px)}52%,80%{transform:translateY(-96px)}100%{transform:translateY(0)}}
@keyframes devswap{0%,30%{opacity:1}33%,100%{opacity:0}}
.pad{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font:700 9px/1 var(--body);color:#fff}
.key{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 3px;border-radius:3px;font:700 9px/1 var(--mono);color:#1f2430;background:#fff;box-shadow:0 1.5px 0 #9aa0ac}

.part{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,44px);margin:84px 0 0;padding-top:22px;border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.part small{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.part+p.lead{color:var(--muted);margin:8px 0 0;max-width:62ch}
header .sub,header .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:4px}
header .sub{margin-top:18px}header p.note{margin-top:10px;font-size:14px}header .back{margin-bottom:18px;font-size:13px;color:var(--muted)}
header .sub:hover,header .back:hover,header .sub:focus-visible,header .back:focus-visible{border-color:var(--red);color:var(--ink);outline:none}
nav.cats .grp{font-family:var(--mono);font-size:11px;color:var(--muted);align-self:center;margin-left:6px;letter-spacing:.06em}
.stage.wide{aspect-ratio:16/9}
.grid.mini{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.card.mini{padding:12px;gap:8px}.card.mini h3{font-size:15px}.card.mini h3 .en{font-size:11px}.card.mini p{font-size:12.5px}.card.mini .tip{font-size:12px}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.web{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.web th,table.web td{text-align:left;vertical-align:top;padding:11px 14px;border-bottom:1px solid var(--line)}
table.web th{font-size:12px;font-family:var(--mono);font-weight:600;color:var(--muted);letter-spacing:.06em}
table.web td:first-child{white-space:nowrap;font-weight:700}
table.web td:first-child span{display:block;font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--muted)}
table.web tr:last-child td{border-bottom:0}
.stage input[type=checkbox],.stage input[type=radio],.stage input[type=range]{accent-color:var(--mpri)}
.sw{position:relative;display:inline-block;width:32px;height:18px;flex:none;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:9px;background:#c5c9d3;transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+i{background:var(--mpri)}.sw input:checked+i::after{transform:translateX(14px)}
.sw input:focus-visible+i{outline:2px solid var(--mred);outline-offset:2px}
.tabbar{display:flex;gap:2px;border-bottom:1.5px solid var(--mln)}
.tabbar button{border:0;background:none;padding:6px 12px;font:600 12px var(--body);color:var(--mmut);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.tabbar button.on{color:var(--mpri);border-bottom-color:var(--mpri)}
.chip{border:1px solid var(--mln);background:var(--msf);border-radius:20px;padding:3px 10px;font:500 11px var(--body);color:var(--mink);cursor:pointer}
.chip.on{background:var(--mpri);border-color:var(--mpri);color:#fff}
.inp{width:100%;box-sizing:border-box;border:1.5px solid var(--mln);border-radius:6px;padding:6px 8px;font:12px var(--body);background:var(--msf);color:var(--mink)}
.inp:focus{outline:none;border-color:var(--mpri)}
@keyframes carousel{0%,28%{transform:translateX(0)}33%,61%{transform:translateX(-100%)}66%,94%{transform:translateX(-200%)}100%{transform:translateX(0)}}
@keyframes cdot0{0%,28%{background:var(--mpri)}33%,94%{background:var(--mln)}100%{background:var(--mpri)}}
@keyframes cdot1{0%,28%{background:var(--mln)}33%,61%{background:var(--mpri)}66%,100%{background:var(--mln)}}
@keyframes cdot2{0%,61%{background:var(--mln)}66%,94%{background:var(--mpri)}100%{background:var(--mln)}}

@keyframes dmg{0%{opacity:0;transform:translateY(6px) scale(.6)}12%{opacity:1;transform:translateY(0) scale(1.15)}22%{transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes type{from{width:0}to{width:100%}}
@keyframes blink{50%{opacity:0}}
@keyframes rays{to{transform:rotate(360deg)}}

@property --hold{syntax:'<number>';inherits:false;initial-value:0}
@keyframes flipglow{0%,20%{transform:rotateY(90deg)}35%,100%{transform:rotateY(0)}}


.lb{position:absolute;left:50%;top:50%}
@keyframes lbshake{0%,12%{transform:none}16%{transform:rotate(-3deg)}18%{transform:rotate(3deg)}20%{transform:rotate(-5deg) scale(1.03)}22%{transform:rotate(5deg) scale(1.05)}24%{transform:rotate(-7deg) scale(1.07)}26%{transform:rotate(7deg) scale(1.09)}28%{transform:scale(.92,1.1)}30%{transform:scale(1.15,.85)}33%,100%{transform:none}}

@keyframes lbleak{0%,14%{opacity:0}28%{opacity:1}31%,100%{opacity:0}}
@keyframes lbpillar{0%,29%{opacity:0;transform:translate(-50%,-100%) scaleX(.2)}32%{opacity:1;transform:translate(-50%,-100%) scaleX(1)}46%,100%{opacity:0;transform:translate(-50%,-100%) scaleX(1.4)}}
@keyframes lbflash{0%,29.5%{opacity:0}31%{opacity:.85}40%,100%{opacity:0}}
@keyframes lbshock{0%,30%{opacity:0;transform:translate(-50%,-50%) scale(.2)}31%{opacity:1}42%,100%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}
@keyframes lbbob{0%,100%{margin-top:0}50%{margin-top:-3px}}

.lbcard .in{position:absolute;inset:0;transform-style:preserve-3d}
.lbcard .f{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font:700 10px var(--body)}
.lbcard .bk{background:repeating-linear-gradient(45deg,#3a2a6a 0 4px,#2e2258 4px 8px);box-shadow:0 0 0 1.5px #8a7ad8;transform:rotateY(180deg)}
.lbcard .fr{background:linear-gradient(#2a2440,#141024)}

@keyframes lbc0{0%,31%{opacity:0;transform:translate(-50%,-50%) translate(0,24px) scale(.25)}33%{opacity:1}43%,90%{opacity:1;transform:translate(-50%,-50%) translate(-105px,-6px) rotate(-7deg) scale(1)}96%,100%{opacity:0;transform:translate(-50%,-50%) translate(-105px,-6px) rotate(-7deg) scale(1)}}
