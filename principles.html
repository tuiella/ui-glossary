 d:'눌렀을 때 아래로 선택지 목록이 펼쳐지고, 그중 하나를 고르면 다시 접히는 컴포넌트입니다. 선택지가 많아도 공간을 적게 차지합니다.',
 vs:'선택지를 직접 타이핑해서 검색하거나 새로 입력할 수 있으면 <b>콤보박스</b>라고 부릅니다. 선택지가 서너 개뿐이면 펼치지 않고 바로 보이는 라디오 버튼이 더 빠릅니다.',
 ex:`<div class="scr" style="padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start"><label style="display:flex;flex-direction:column;gap:4px"><b style="font-size:11px">언어</b><select class="inp"><option>한국어</option><option>English</option><option>日本語</option></select></label><div style="display:flex;flex-direction:column;gap:4px"><b style="font-size:11px">화면 해상도</b><div class="inp" style="display:flex;justify-content:space-between">1920 × 1080<span>▴</span></div><div class="panel" style="padding:3px 0;font-size:11px">${['2560 × 1440','1920 × 1080','1280 × 720'].map((x,i)=>`<div style="padding:4px 8px;${i==1?'background:#e7ecff;color:var(--mpri);font-weight:700':''}">${x}</div>`).join('')}</div></div></div>`},
{cat:'common',one:1,ko:'입력 필드와 플레이스홀더',en:'Input Field & Placeholder',
 d:'글자를 직접 입력하는 칸입니다. 칸 안에 흐리게 적힌 안내 문구를 플레이스홀더라고 하고, 입력을 시작하면 사라집니다. 칸 아래에는 도움말이나 오류 문구를 둡니다.',
 vs:'플레이스홀더는 입력하면 사라지므로 칸의 이름(레이블)을 대신하면 안 됩니다. 레이블은 칸 위나 옆에 계속 보이게 둡니다.',
 ex:`<div class="scr" style="padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center"><label style="display:flex;flex-direction:column;gap:3px"><b style="font-size:11px">닉네임</b><input class="inp" placeholder="2~12자 한글, 영문"><span class="mut" style="font-size:10px">나중에 한 번 바꿀 수 있습니다.</span></label><label style="display:flex;flex-direction:column;gap:3px"><b style="font-size:11px">길드 이름</b><input class="inp" value="별" style="border-color:var(--mred)"><span style="font-size:10px;color:var(--mred)">2자 이상 입력하세요.</span></label></div>`},
{cat:'common',one:1,ko:'스테퍼',en:'Stepper',
 d:'숫자 양옆의 −, + 버튼으로 값을 하나씩 늘리고 줄이는 컴포넌트입니다. 구매 수량, 인원 수처럼 정확한 정수를 고를 때 씁니다.',
 vs:'"1단계, 2단계"처럼 진행 단계를 보여 주는 컴포넌트도 스테퍼라고 부르는데, 바로 아래 단계 진행 바에서 따로 다룹니다. 범위가 넓은 값은 슬라이더가 낫습니다.',
 ex:`<div class="scr" style="display:grid;place-items:center"><div class="panel" data-stepper data-price="120" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:center"><b>체력 물약 구매</b><div style="display:flex;align-items:center;gap:10px"><button class="btn ghost" data-step="-1" style="width:28px;padding:4px 0">−</button><b data-val style="font-size:18px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums">3</b><button class="btn ghost" data-step="1" style="width:28px;padding:4px 0">+</button></div><span class="mut" style="font-size:11px">합계 <b data-total style="color:var(--mgold)">360</b> 골드</span></div></div>`},
{cat:'common',one:1,ko:'단계 진행 바, 스텝 인디케이터',en:'Step Indicator / Progress Stepper',anim:1,
 d:'여러 단계를 거쳐야 끝나는 과정에서 지금 몇 번째 단계인지, 몇 단계가 남았는지 보여 주는 컴포넌트입니다. 게임에서는 캐릭터 만들기, 튜토리얼, 구매 과정에 씁니다.',
 vs:'바로 위 스테퍼(−, + 버튼)와 같은 "스테퍼"라는 이름으로 부르기도 해서 헷갈립니다. 구분하려면 <b>스텝 인디케이터(Step Indicator)</b>나 <b>프로그레스 스테퍼</b>라고 부릅니다.',
 t:'단계가 다섯 개를 넘으면 한눈에 안 들어오니, 단계를 묶어 줄이거나 "3 / 7"처럼 숫자로 보여 줍니다.',
 ex:`<div class="scr" style="padding:14px"><b style="font-size:12px">캐릭터 만들기</b><div style="position:absolute;left:40px;top:64px;width:240px;height:3px;background:var(--mln)"></div><div style="position:absolute;left:40px;top:64px;height:3px;background:var(--mpri);animation:spFill 6s linear infinite"></div><div style="position:absolute;left:29px;top:54px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--body);animation:spC0 6s infinite">1</div><span style="position:absolute;left:40px;top:84px;transform:translateX(-50%);font-size:10.5px;font-weight:600">종족</span><div style="position:absolute;left:109px;top:54px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--body);animation:spC1 6s infinite">2</div><span style="position:absolute;left:120px;top:84px;transform:translateX(-50%);font-size:10.5px;font-weight:600">직업</span><div style="position:absolute;left:189px;top:54px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--body);animation:spC2 6s infinite">3</div><span style="position:absolute;left:200px;top:84px;transform:translateX(-50%);font-size:10.5px;font-weight:600">외형</span><div style="position:absolute;left:269px;top:54px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--body);animation:spC3 6s infinite">4</div><span style="position:absolute;left:280px;top:84px;transform:translateX(-50%);font-size:10.5px;font-weight:600">이름</span><span class="btn" style="position:absolute;right:14px;bottom:14px">다음</span><span class="btn ghost" style="position:absolute;left:14px;bottom:14px">이전</span></div>`},
{cat:'common',one:1,ko:'배지',en:'Badge',
 d:'아이콘이나 이름 옆에 붙어 개수, 상태, 새 소식을 알려 주는 작은 표시입니다. 숫자 배지, NEW 배지, 등급 배지 등이 있습니다.',
 vs:'숫자 없이 점 하나만 찍은 것은 <b>레드닷</b>이라고 부릅니다. 누를 수 있는 작은 이름표는 배지가 아니라 칩입니다.',
 ex:`<div class="scr" style="display:flex;align-items:center;justify-content:center;gap:28px"><span style="position:relative;display:inline-flex;transform:scale(1.6)">${G.mail}<span class="dot" style="min-width:12px;height:12px;font-size:8.5px;line-height:12px;top:-5px;right:-7px">12</span></span><div style="position:relative">${itm('#7048e8','gem','','#e0b040')}<span style="position:absolute;top:-6px;left:-6px;background:var(--mred);color:#fff;font:700 8px/1 var(--mono);padding:2px 3px;border-radius:3px">NEW</span></div><span style="background:#ffe8a3;color:#8a5a00;font-weight:700;font-size:10.5px;padding:2px 8px;border-radius:10px">전설</span></div>`},
{cat:'common',one:1,ko:'칩과 태그',en:'Chip & Tag',
 d:'짧은 단어를 둥근 이름표 모양으로 감싼 컴포넌트입니다. 눌러서 필터를 켜고 끄는 것은 칩, 아이템의 속성을 보여 주기만 하는 것은 태그라고 주로 부릅니다.',
 vs:'칩은 누를 수 있고 태그는 보통 누를 수 없습니다. 배지는 다른 요소 위에 붙는 작은 표시입니다.',
 ex:`<div class="scr" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px;justify-content:center"><div style="display:flex;gap:6px;flex-wrap:wrap">${['전체','무기','방어구','소모품'].map((x,i)=>`<button class="chip ${i==1?'on':''}" data-chip>${x}</button>`).join('')}</div><div class="panel" style="padding:8px;display:flex;align-items:center;gap:8px">${itm('#e5484d','sword')}<div><b>화염의 검</b><div style="display:flex;gap:4px;margin-top:3px">${['화염','한손','희귀'].map(x=>`<span style="font-size:10px;background:var(--mbg);border-radius:4px;padding:1px 6px" class="mut">#${x}</span>`).join('')}</div></div></div></div>`},
{cat:'common',one:1,ko:'카드',en:'Card',
 d:'그림, 제목, 짧은 설명, 버튼 같은 관련 정보를 한 상자에 묶은 컴포넌트입니다. 여러 개를 나란히 놓고 비교하기 좋아서 상점, 캐릭터 선택, 이벤트 목록에 많이 씁니다.',
 vs:'정보가 한 줄이면 카드 대신 목록의 행(리스트 아이템)이 더 가볍습니다.',
 ex:`<div class="scr" style="padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[['#e5484d','sword','화염의 검','1,200'],['#3b5bdb','shield','얼음 방패','980'],['#2f9e44','potion','회복 물약','120']].map(([c,g,n,v])=>`<div class="panel" style="padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="transform:scale(1.3);margin:6px 0">${itm(c,g)}</div><b style="font-size:11px">${n}</b><span style="color:var(--mgold);font-weight:700;font-size:11px">${v} 골드</span><button class="btn" style="padding:3px 0;width:100%;font-size:11px">구매</button></div>`).join('')}</div>`},
{cat:'common',one:1,ko:'캐러셀, 배너',en:'Carousel / Banner',anim:1,
 d:'같은 자리에서 여러 장의 그림이나 카드가 옆으로 넘어가며 보이는 컴포넌트입니다. 아래 점으로 몇 장 중 몇 번째인지 알려 줍니다. 게임 로비의 이벤트 배너에 자주 씁니다.',
 vs:'자동으로 넘어가는 캐러셀은 사람들이 두 번째 장부터 잘 안 봅니다. 꼭 봐야 하는 정보는 캐러셀에 숨기지 않습니다.',
 ex:`<div class="scr" style="padding:10px"><div style="position:relative;height:130px;border-radius:8px;overflow:hidden"><div style="display:flex;height:100%;animation:carousel 7.5s infinite">${[['#3b5bdb','#7048e8','여름 이벤트','7월 31일까지'],['#e5484d','#f08c00','신규 영웅 출시','지금 소환하기'],['#2f9e44','#0ca678','출석 보상 2배','이번 주말만']].map(([a,b,t,u])=>`<div style="flex:none;width:100%;height:100%;background:linear-gradient(120deg,${a},${b});color:#fff;padding:18px;box-sizing:border-box"><b style="font-size:18px">${t}</b><div style="opacity:.85">${u}</div></div>`).join('')}</div></div><div style="display:flex;gap:5px;justify-content:center;margin-top:7px">${[0,1,2].map(i=>`<span style="width:7px;height:7px;border-radius:50%;animation:cdot${i} 7.5s infinite"></span>`).join('')}</div></div>`},
{cat:'common',one:1,ko:'팝업과 모달',en:'Pop-up & Modal',
 d:'팝업은 화면 위에 갑자기 떠오르는 창을 넓게 부르는 말이고, 모달은 그중에서 닫기 전까지 뒤 화면을 만질 수 없게 막는 창을 말합니다. 모달은 보통 뒤를 어둡게 누르는 딤과 함께 씁니다.',
 vs:'뒤 화면을 막지 않는 창은 바로 아래 모달리스 창입니다. 게임에서는 "팝업"이라는 말로 보상창, 공지창, 상품 안내창까지 다 부르는 경우가 많고, 보상창은 게임 전용 컴포넌트의 보상 팝업에서 따로 다룹니다.',
 ex:`<div class="gamebg">${hero(70,62)}${hero(220,70)}<div style="position:absolute;inset:0;background:rgba(10,12,20,.5)"></div><div class="panel" style="position:absolute;left:80px;right:80px;top:30px;padding:12px;text-align:center"><b>공지</b><div class="mut" style="font-size:11px;margin:4px 0 8px">오늘 밤 2시에 점검이 있습니다.</div><button class="btn">확인</button></div><div style="position:absolute;right:12px;bottom:8px;color:#fff;font-size:10px">뒤 화면은 누를 수 없음</div></div>`},
{cat:'common',one:1,ko:'모달리스 창',en:'Modeless Window',anim:1,
 d:'떠 있는 동안에도 뒤 화면을 계속 만질 수 있는 창입니다. 채팅창, 친구 목록처럼 옆에 띄워 두고 다른 일을 함께 하는 창에 씁니다.',
 vs:'바로 위 모달은 닫기 전까지 뒤 화면을 막고 딤으로 어둡게 누르지만, 모달리스 창은 딤이 없고 뒤를 막지 않습니다. <b>논모달(Non-modal)</b> 창이라고도 부릅니다.',
 t:'여러 개를 띄울 수 있으니 창을 옮기거나 접을 수 있게 하고, 어느 창이 앞에 있는지 보이게 합니다.',
 ex:`<div class="scr" style="background:var(--mbg)"><div style="position:absolute;left:12px;top:12px;border-radius:6px;">${itm('#e5484d','potion')}</div><div style="position:absolute;left:46px;top:12px;border-radius:6px;">${itm('#868e96','sword')}</div><div style="position:absolute;left:80px;top:12px;border-radius:6px;">${itm('#a87444','shield')}</div><div style="position:absolute;left:114px;top:12px;border-radius:6px;">${itm('#7048e8','gem')}</div><div style="position:absolute;left:148px;top:12px;border-radius:6px;">${itm('#2f9e44','potion')}</div><div style="position:absolute;left:12px;top:46px;border-radius:6px;">${itm('#3b5bdb','shield')}</div><div style="position:absolute;left:46px;top:46px;border-radius:6px;animation:mlSel 3s infinite">${itm('#c98a10','gem')}</div><div style="position:absolute;left:80px;top:46px;border-radius:6px;">${itm('#868e96','sword')}</div><div style="position:absolute;left:114px;top:46px;border-radius:6px;">${itm('#e5484d','potion')}</div><div style="position:absolute;left:148px;top:46px;border-radius:6px;">${itm('#a87444','shield')}</div><div class="panel" style="position:absolute;right:12px;top:16px;width:118px;padding:0 0 6px;font-size:10px;box-shadow:0 6px 16px rgba(20,24,40,.25)"><div style="display:flex;justify-content:space-between;padding:5px 8px;background:var(--mpri);color:#fff;border-radius:6px 6px 0 0;font-weight:700">채팅<span>×</span></div><div style="padding:5px 8px;line-height:1.6"><div><b style="color:var(--mpri)">렌카</b> 던전 갈 사람</div><div><b style="color:#2f9e44">하이렌</b> 저요</div><div><b style="color:#c98a10">도르카</b> 5분만</div></div><div style="margin:0 8px;padding:3px 6px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--mln);color:var(--mmut)">메시지 입력</div></div><svg style="position:absolute;left:0;top:0;animation:mlCur 3s ease-in-out infinite" width="12" height="16" viewBox="0 0 12 16"><path d="M1 1v12l3.5-3 2.5 5 2-1-2.5-5H11z" fill="#fff" stroke="#000"/></svg></div>`},
{cat:'common',one:1,ko:'토스트와 스낵바',en:'Toast & Snackbar',
 d:'둘 다 화면 아래쪽에 잠깐 떴다가 사라지는 짧은 알림입니다. 알림만 하면 <b>토스트</b>, "되돌리기"처럼 누를 수 있는 행동 하나를 함께 넣으면 <b>스낵바</b>라고 부릅니다.',
 vs:'게임에서는 둘을 따로 부르지 않고 "토스트", "시스템 메시지"라고 묶어 부르는 경우가 많습니다. 게임 전용 컴포넌트의 업적 알림, 킬 피드도 토스트의 한 종류로 볼 수 있습니다.',
 ex:`<div class="scr"><div style="position:absolute;left:50%;transform:translateX(-50%);top:40px;background:#1f2430;color:#fff;border-radius:20px;padding:6px 14px;font-size:11px;white-space:nowrap">토스트: 저장되었습니다.</div><div style="position:absolute;left:30px;right:30px;bottom:30px;background:#1f2430;color:#fff;border-radius:6px;padding:8px 12px;font-size:11px;display:flex;justify-content:space-between;align-items:center">스낵바: 아이템을 버렸습니다.<b style="color:#91a7ff;cursor:pointer">되돌리기</b></div></div>`},
{cat:'common',one:1,ko:'코치마크',en:'Coach Mark',
 d:'처음 쓰는 사람에게 화면의 특정 부분을 짚어 주는 튜토리얼 표시입니다. 화면을 어둡게 하고 눌러야 할 곳만 뚫어 보여 준 뒤, 손가락 그림과 짧은 설명을 붙입니다.',
 vs:'앱이나 게임을 처음 켰을 때 여러 장에 걸쳐 기능을 소개하는 흐름 전체는 <b>온보딩</b>이라고 합니다. 코치마크는 그 안에서 쓰이는 한 장면입니다.',
 ex:`<div class="scr" style="padding:12px;display:flex;flex-direction:column;gap:8px"><b>마을</b><div style="display:flex;gap:8px"><button class="btn ghost">상점</button><button class="btn" style="position:relative;z-index:2">모험 떠나기</button><button class="btn ghost">가방</button></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 128px 50px,transparent 0 40px,rgba(10,12,20,.62) 42px);z-index:1"></div><div style="position:absolute;left:118px;top:56px;z-index:3"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10l5.2 1a2 2 0 0 1 1.6 2.3L18 19a3 3 0 0 1-3 2.5h-3.6a3 3 0 0 1-2.4-1.2L5.2 15a1.4 1.4 0 0 1 2.1-1.8z" fill="#fff" stroke="#1f2430" stroke-width="1.4" stroke-linejoin="round"/></svg></div><div style="position:absolute;left:150px;top:76px;z-index:3;color:#fff;font-weight:700;font-size:12px">여기를 눌러 첫 모험을 떠나 보세요</div></div>`},
{cat:'common',one:1,ko:'아코디언',en:'Accordion',
 d:'제목을 누르면 그 아래 내용이 펼쳐지고, 다시 누르면 접히는 컴포넌트입니다. 긴 설정이나 도움말을 한 화면에 정리할 때 씁니다.',
 vs:'탭은 내용 하나만 보이고 나머지는 숨기지만, 아코디언은 여러 칸을 동시에 펼쳐 둘 수도 있습니다.',
 ex:`<div class="scr" style="padding:10px 14px;display:flex;flex-direction:column;gap:5px;overflow:auto">${[['그래픽','화면 밝기, 그림자 품질, 프레임 제한'],['소리','배경 음악, 효과음, 음성'],['조작','키 설정, 패드 진동, 감도']].map(([a,b],i)=>`<details class="panel" style="padding:6px 10px" ${i?'':'open'}><summary style="cursor:pointer;font-weight:700">${a}</summary><div class="mut" style="font-size:11px;padding:4px 0 2px">${b}</div></details>`).join('')}</div>`},
{cat:'common',one:1,ko:'바텀 시트',en:'Bottom Sheet',anim:1,
 d:'화면 아래에서 위로 올라오는 판 모양의 창입니다. 휴대폰에서 엄지손가락이 닿기 쉬운 곳에 선택지를 띄울 수 있어서 모바일 게임 메뉴에 자주 씁니다.',
 vs:'화면 옆에서 밀려 나오는 것은 사이드 시트(드로어), 가운데에 뜨는 것은 모달입니다.',
 ex:`<div style="position:absolute;inset:8px 34%;background:#111;border-radius:18px;padding:3px"><div style="position:relative;height:100%;border-radius:15px;overflow:hidden;background:var(--mbg)"><div style="padding:16px 8px 0;font-weight:700;font-size:10px">길드원 목록</div><div style="position:absolute;inset:0;background:rgba(10,12,20,.45);animation:sheetdim 4s infinite"></div><div style="position:absolute;left:0;right:0;bottom:0;background:var(--msf);border-radius:12px 12px 0 0;padding:8px;animation:sheet 4s cubic-bezier(.2,.8,.3,1) infinite"><div style="width:26px;height:3px;border-radius:2px;background:var(--mln);margin:0 auto 6px"></div>${['프로필 보기','귓속말','강퇴'].map((x,i)=>`<div style="padding:5px 2px;font-size:10px;${i==2?'color:var(--mred)':''}">${x}</div>`).join('')}</div></div></div>`},
{cat:'common',one:1,ko:'CTA 버튼',en:'Call to Action',
 d:'"지금 구매", "모험 떠나기"처럼 그 화면에서 사용자가 가장 했으면 하는 행동 하나를 맡은 버튼입니다. 크기, 색, 위치로 다른 버튼보다 확실히 눈에 띄게 합니다.',
 vs:'한 화면에 CTA는 하나가 원칙입니다. 강조 버튼이 여러 개면 무엇이 CTA인지 알 수 없습니다(원칙 파트의 대비와 강조 참고).',
 ex:`<div class="scr" style="background:linear-gradient(135deg,#3b2a6a,#1f2430);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><span style="font-size:10px;opacity:.8">한정 패키지</span><b style="font-size:18px">전설 영웅 선택권</b><span style="font-size:11px;opacity:.8">전설 영웅 1명을 직접 고릅니다</span><button class="btn" style="background:#ffd43b;color:#3a2a00;padding:8px 26px;font-size:14px;margin-top:4px">지금 구매 9,900원</button><span style="font-size:10px;opacity:.6;text-decoration:underline">구성 자세히 보기</span></div>`},

{cat:'common',one:1,ko:'컨텍스트 메뉴, 우클릭 메뉴',en:'Context Menu',
 d:'마우스 오른쪽 버튼을 누르거나 길게 누르면 그 자리에 뜨는, 지금 가리킨 대상에만 해당하는 기능 목록입니다. 아이템 위에서 열면 사용, 장착, 나누기, 버리기 같은 메뉴가 나옵니다.',
 vs:'케밥 메뉴(⋮)는 눈에 보이는 버튼을 눌러 여는 것이고, 컨텍스트 메뉴는 버튼 없이 대상 위에서 바로 여는 것입니다.',
 ex:`<div class="scr" style="background:#1f2430;padding:12px"><div style="display:grid;grid-template-columns:repeat(6,30px);gap:4px">${itm('#e5484d','potion','12')}${itm('#868e96','sword')}${itm('#a87444','shield')}${'<div class="itm" style="background:#2c3240"></div>'.repeat(9)}</div><div style="position:absolute;left:28px;top:36px;width:104px;background:#2a2e3a;border:1px solid #4a5060;border-radius:6px;padding:3px 0;color:#fff;font-size:11px;box-shadow:0 6px 14px rgba(0,0,0,.4)">${['사용','단축키에 등록','나누기','버리기'].map((x,i)=>`<div style="padding:4px 10px;${i==0?'background:#3b5bdb':''};${i==3?'color:#ff8787;border-top:1px solid #4a5060':''}">${x}</div>`).join('')}</div><svg style="position:absolute;left:22px;top:28px" width="12" height="16" viewBox="0 0 12 16"><path d="M1 1v12l3.5-3 2.5 5 2-1-2.5-5H11z" fill="#fff" stroke="#000"/></svg></div>`},
{cat:'common',one:1,ko:'세그먼트 컨트롤',en:'Segmented Control',
 d:'두세 개의 선택지를 붙어 있는 버튼 한 줄로 만들어, 그중 하나를 고르는 컴포넌트입니다. 탭보다 작고 가벼워서 랭킹의 "일간, 주간, 시즌"처럼 같은 목록의 보기 방식을 바꿀 때 씁니다.',
 vs:'기능은 라디오 버튼과 같고 모양만 버튼 줄입니다. 화면 전체를 바꾸면 탭, 같은 내용의 보기만 바꾸면 세그먼트 컨트롤을 씁니다.',
 ex:`<div class="scr" style="padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px"><div class="seg">${['일간','주간','시즌'].map((x,i)=>`<label><input type="radio" name="segrank" value="${i}" ${i==1?'checked':''}><span>${x}</span></label>`).join('')}</div>${[[['렌카','12,480'],['피코','11,920'],['로젤','10,305']],[['로젤','84,210'],['렌카','79,660'],['도르카','71,045']],[['벨루나','1,204,880'],['로젤','1,187,300'],['하이렌','1,090,412']]].map((l,k)=>`<div class="panel segpane" data-seg="${k}" style="width:100%;padding:4px 10px;font-size:11px">${l.map(([nm,v],r)=>`<div style="display:flex;padding:4px 0"><span>${r+1}위 ${nm}</span><b style="margin-left:auto;font-variant-numeric:tabular-nums">${v}</b></div>`).join('')}</div>`).join('')}</div>`},
{cat:'common',one:1,ko:'피커, 드럼 피커',en:'Picker Wheel',
 d:'원통을 위아래로 돌려서 값을 고르는 컴포넌트입니다. 가운데 띠 안에 들어온 값이 선택되고, 위아래는 흐려지며 원통처럼 보입니다. 휴대폰의 시간 선택에서 많이 봅니다. <b>픽커, 픽커 휠</b>이라고 적기도 합니다.',
 t:'오른쪽 원통은 실제로 스크롤해서 돌려 볼 수 있습니다.',
 ex:`<div class="scr" style="display:grid;place-items:center"><div style="display:flex;gap:6px;align-items:center"><b class="mut" style="font-size:11px">알람</b><div style="position:relative;width:70px;height:120px;border-radius:8px;background:var(--msf);box-shadow:0 1px 3px rgba(0,0,0,.15)"><div style="position:absolute;left:4px;right:4px;top:46px;height:28px;border-radius:6px;background:var(--mbg)"></div><div tabindex="0" style="position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask:linear-gradient(transparent,#000 35%,#000 65%,transparent)"><div style="height:46px"></div>${Array.from({length:12},(_,i)=>`<div style="height:28px;line-height:28px;text-align:center;scroll-snap-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums">${String(i*5).padStart(2,'0')}분</div>`).join('')}<div style="height:46px"></div></div></div></div></div>`},
{cat:'common',one:1,ko:'스와이프 액션',en:'Swipe Action',anim:1,
 d:'목록의 한 줄을 옆으로 밀면 뒤에 숨어 있던 삭제, 보관 같은 버튼이 드러나는 조작입니다. 휴대폰에서 버튼을 늘 보이게 두지 않고도 빠르게 정리할 수 있습니다.',
 vs:'밀어서 바로 지워지게 하면 실수가 잦아서, 버튼을 한 번 더 누르게 하거나 되돌리기 스낵바를 함께 둡니다.',
 ex:`<div class="scr" style="padding:12px"><b>우편함</b><div style="margin-top:6px;display:flex;flex-direction:column;gap:5px">${['출석 보상','길드 지원','이벤트 보상'].map((x,i)=>`<div style="position:relative;height:30px;border-radius:6px;overflow:hidden;${i==0?'background:var(--mred)':''}">${i==0?'<b style="position:absolute;right:14px;top:8px;color:#fff;font-size:11px">삭제</b>':''}<div class="panel" style="position:absolute;inset:0;border-radius:6px;padding:7px 10px;${i==0?'animation:swipe 3s ease-in-out infinite':''}">${x}</div></div>`).join('')}</div></div>`},
{cat:'common',one:1,ko:'풀 투 리프레시, 당겨서 새로고침',en:'Pull to Refresh',anim:1,
 d:'목록 맨 위에서 화면을 아래로 끌어당기면 새로 불러오는 조작입니다. 당기는 동안 위쪽에 도는 표시가 나타나고, 놓으면 새 내용이 채워집니다.',
 ex:`<div style="position:absolute;inset:8px 34%;background:#111;border-radius:18px;padding:3px"><div style="position:relative;height:100%;border-radius:15px;overflow:hidden;background:var(--mbg)"><div style="position:absolute;left:50%;top:12px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2.5px solid var(--mln);border-top-color:var(--mpri);animation:spin .8s linear infinite,pullsp 3s infinite"></div><div style="padding:6px;animation:pull 3s cubic-bezier(.3,.7,.3,1) infinite">${['공지사항','점검 안내','이벤트','업데이트'].map(x=>`<div class="panel" style="padding:6px 8px;margin-bottom:4px;font-size:10px">${x}</div>`).join('')}</div></div></div>`},
{cat:'common',one:1,ko:'스티키 헤더, 고정 헤더',en:'Sticky Header',
 d:'목록을 스크롤해도 화면 위에 붙어 있는 제목 줄입니다. 긴 목록에서 지금 어느 묶음을 보고 있는지 계속 알 수 있습니다.',
 t:'오른쪽 목록은 실제로 스크롤됩니다. 묶음 제목이 위에 붙었다가 다음 제목이 올라오면 밀려납니다.',
 ex:`<div class="scr" style="padding:10px"><div class="panel" tabindex="0" style="height:100%;overflow-y:auto;scrollbar-width:thin">${[['무기',['철검','화염의 검','얼음 단검']],['방어구',['나무 방패','가죽 장화','강철 투구']],['소모품',['체력 물약','마나 물약','해독제']]].map(([h,l])=>`<div style="position:sticky;top:0;background:#e7ecff;color:var(--mpri);font-weight:700;font-size:11px;padding:4px 10px">${h}</div>${l.map(x=>`<div style="padding:6px 10px;border-bottom:1px solid var(--mln);font-size:11px">${x}</div>`).join('')}`).join('')}</div></div>`},
{cat:'common',one:1,ko:'플로팅 액션 버튼, FAB',en:'Floating Action Button (FAB)',
 d:'화면 구석, 주로 오른쪽 아래에 떠 있는 동그란 큰 버튼입니다. 그 화면에서 가장 자주 하는 행동 하나(새로 만들기, 글쓰기)를 맡고, 스크롤해도 같은 자리에 있습니다.',
 vs:'CTA 버튼은 화면 흐름 안에 놓이고, FAB는 내용 위에 떠 있다는 점이 다릅니다. 게임에서는 채팅 열기, 빠른 이동 버튼에 비슷하게 씁니다.',
 ex:`<div style="position:absolute;inset:8px 34%;background:#111;border-radius:18px;padding:3px"><div style="position:relative;height:100%;border-radius:15px;overflow:hidden;background:var(--mbg);padding:16px 6px 0">${['길드 게시판','공략 모음','자유 게시판','질문 게시판'].map(x=>`<div class="panel" style="padding:6px 8px;margin-bottom:4px;font-size:10px">${x}</div>`).join('')}<span style="position:absolute;right:10px;bottom:12px;width:30px;height:30px;border-radius:50%;background:var(--mpri);color:#fff;display:grid;place-items:center;font-size:20px;line-height:1;box-shadow:0 4px 10px rgba(59,91,219,.5)">+</span></div></div>`},
{cat:'gpart',one:1,ko:'퀵슬롯, 핫바',en:'Quick Slot / Hotbar',
 d:'자주 쓰는 아이템이나 스킬을 숫자 키나 버튼 하나로 바로 쓸 수 있게 늘어놓은 칸입니다. 화면 아래쪽에 가로로 두는 경우가 많고, 각 칸에 단축키 번호를 적어 둡니다.',
 vs:'라디얼 메뉴도 자주 쓰는 것을 빨리 고르는 컴포넌트지만, 퀵슬롯은 늘 화면에 보이고 라디얼 메뉴는 버튼을 누르고 있을 때만 열립니다.',
 ex:`<div class="gamebg">${hero(150,60)}<div style="position:absolute;left:50%;transform:translateX(-50%);bottom:8px;display:flex;gap:4px;background:rgba(10,12,20,.55);padding:5px;border-radius:8px">${[['#e5484d','sword','',1],['#3b5bdb','shield','',2],['#2f9e44','potion','8',3],['#7048e8','gem','',4],['','','',5],['','','',6]].map(([c,g,n,k])=>`<div style="position:relative">${c?itm(c,g,n):'<div class="itm" style="background:rgba(255,255,255,.12)"></div>'}<span style="position:absolute;left:2px;top:0;font:700 8px var(--mono);color:#fff;text-shadow:0 0 2px #000">${k}</span></div>`).join('')}</div></div>`},
{cat:'gpart',one:1,ko:'크로스헤어, 조준점',en:'Crosshair / Reticle',
 d:'화면 가운데에 떠서 지금 어디를 겨누고 있는지 보여 주는 표시입니다. 점, 십자, 원 등 모양이 있고, 적에게 맞으면 잠깐 바뀌는 표시는 <b>히트 마커</b>라고 부릅니다.',
 vs:'맞혔을 때 조준점 둘레에 잠깐 뜨는 X는 바로 아래 히트 마커, 연사할 때 조준점이 벌어지는 것은 조준점 벌어짐(블룸)에서 따로 다룹니다.',
 ex:`<div class="scr" style="background:linear-gradient(#5a7aa0 0 60%,#4a5a3a 60%);display:flex;align-items:center;justify-content:space-around">${[`<span style="width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000"></span>`,`<span style="position:relative;width:24px;height:24px"><i style="position:absolute;left:11px;top:0;width:2px;height:8px;background:#fff"></i><i style="position:absolute;left:11px;bottom:0;width:2px;height:8px;background:#fff"></i><i style="position:absolute;top:11px;left:0;height:2px;width:8px;background:#fff"></i><i style="position:absolute;top:11px;right:0;height:2px;width:8px;background:#fff"></i></span>`,`<span style="position:relative;width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-sizing:border-box"><i style="position:absolute;left:9px;top:9px;width:4px;height:4px;border-radius:50%;background:#fff"></i></span>`,`<span style="position:relative;width:24px;height:24px;transform:rotate(45deg)"><i style="position:absolute;left:11px;top:0;width:2px;height:7px;background:#ff6b6b"></i><i style="position:absolute;left:11px;bottom:0;width:2px;height:7px;background:#ff6b6b"></i><i style="position:absolute;top:11px;left:0;height:2px;width:7px;background:#ff6b6b"></i><i style="position:absolute;top:11px;right:0;height:2px;width:7px;background:#ff6b6b"></i></span>`].map((x,i)=>`<span style="display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-size:10px">${x}<span>${['점','십자','원','히트 마커'][i]}</span></span>`).join('')}</div>`},
{cat:'gpart',one:1,ko:'히트 마커',en:'Hit Marker',anim:1,
 d:'총알이 적에게 맞는 순간 조준점 둘레에 잠깐 뜨는 X 모양 표시입니다. 맞혔다는 것을 소리와 함께 바로 알려 주고, 치명타나 머리를 맞히면 색과 크기를 바꿔 구분합니다.',
 vs:'조준점이 벌어지는 것은 조준점 벌어짐(블룸)이고, 히트 마커는 맞힌 결과만 알려 줍니다. 내가 맞았을 때 뜨는 것은 피격 인디케이터입니다.',
 t:'처치했을 때는 해골 아이콘이나 더 굵은 X처럼 다른 모양을 써서 맞힘과 처치를 구분합니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#5a7aa0 0 60%,#4a5a3a 60%)"><div style="position:absolute;left:50%;top:50%;width:36px;height:52px;margin:-10px 0 0 -18px;animation:hmDummy 2.4s infinite"><div style="width:20px;height:20px;margin:0 auto;border-radius:50%;background:#5a3a4a"></div><div style="width:32px;height:30px;margin:2px auto 0;border-radius:6px 6px 2px 2px;background:#4a2a3a"></div></div><span style="position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000"></span><div style="position:absolute;left:50%;top:50%;width:0;height:0;animation:hmPop1 2.4s infinite"><i style="position:absolute;left:-1.5px;top:-4px;width:3px;height:7px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55);transform:rotate(45deg) translateY(-14px)"></i><i style="position:absolute;left:-1.5px;top:-4px;width:3px;height:7px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55);transform:rotate(135deg) translateY(-14px)"></i><i style="position:absolute;left:-1.5px;top:-4px;width:3px;height:7px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55);transform:rotate(225deg) translateY(-14px)"></i><i style="position:absolute;left:-1.5px;top:-4px;width:3px;height:7px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55);transform:rotate(315deg) translateY(-14px)"></i></div><div style="position:absolute;left:50%;top:50%;width:0;height:0;animation:hmPop2 2.4s infinite"><i style="position:absolute;left:-1.5px;top:-4px;width:3px;height:7px;background:#ff4040;box-shadow:0 0 0 1px rgba(0,0,0,.55);transform:rotate(45deg) translateY(-14px)"></i><i style="position:absolute;left:-1.5px;top:-4px;width:3px;height:7px;background:#ff4040;box-shadow:0 0 0 1px rgba(0,0,0,.55);transform:rotate(135deg) translateY(-14px)"></i><i style="position:absolute;left:-1.5px;top:-4px;width:3px;height:7px;background:#ff4040;box-shadow:0 0 0 1px rgba(0,0,0,.55);transform:rotate(225deg) translateY(-14px)"></i><i style="position:absolute;left:-1.5px;top:-4px;width:3px;height:7px;background:#ff4040;box-shadow:0 0 0 1px rgba(0,0,0,.55);transform:rotate(315deg) translateY(-14px)"></i></div></div>`},
{cat:'gpart',one:1,ko:'이름표, 네임플레이트',en:'Nameplate',
 d:'캐릭터나 몬스터 머리 위에 떠 있는 이름표입니다. 이름과 함께 작은 체력 바, 레벨, 길드 이름, 적과 아군을 구분하는 색을 담습니다.',
 ex:`<div class="gamebg">${[[60,'로젤','Lv.32','#51cf66',.9],[150,'숲 늑대','Lv.28','#ff6b6b',.4],[235,'상인 로이','상점','#ffd43b',1]].map(([x,n,l,c,h])=>`<div style="position:absolute;left:${x-24}px;top:44px;width:70px;text-align:center;color:#fff;font-size:9.5px;text-shadow:0 1px 2px #000"><b style="color:${c}">${n}</b> <span style="opacity:.8">${l}</span><div style="height:3px;margin:2px 10px 0;background:rgba(0,0,0,.5)"><div style="width:${h*100}%;height:100%;background:${c}"></div></div></div>${hero(x,72)}`).join('')}</div>`},
{cat:'gpart',one:1,ko:'데미지 텍스트, 데미지 폰트',en:'Floating Damage Numbers',anim:1,
 d:'공격이 맞은 자리에서 피해량이 튀어나와 위로 떠오르며 사라지는 숫자입니다. 치명타는 더 크고 다른 색으로, 회복은 초록으로 구분합니다. 영어로는 <b>플로팅 데미지 숫자(Floating Damage Numbers)</b>라고 합니다.',
 ex:`<div class="gamebg">${hero(150,80)}${[['128',120,60,'#fff',14,0],['치명타 512',150,40,'#ffa94d',19,.5],['+45',190,64,'#69db7c',13,1]].map(([t,x,y,c,f,d])=>`<b style="position:absolute;left:${x}px;top:${y}px;color:${c};font-size:${f}px;-webkit-text-stroke:2.5px #1f2430;paint-order:stroke fill;white-space:nowrap;animation:dmg 1.5s ${d}s infinite both">${t}</b>`).join('')}</div>`},
{cat:'gpart',one:1,ko:'상단 재화 바',en:'Currency Bar',
 d:'화면 맨 위에 늘 떠 있는 재화 표시 줄입니다. 골드, 보석, 행동력 같은 재화와 옆에 붙은 + 버튼(충전, 상점 이동)으로 이루어집니다.',
 ex:`<div class="scr" style="background:linear-gradient(#3a3050,#2a2234)"><div style="display:flex;gap:8px;justify-content:flex-end;padding:8px">${[['#f2b33d','12.4K'],['#be4bdb','860'],['#51cf66','42/60']].map(([c,v])=>`<div style="display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.4);border-radius:12px;padding:3px 4px 3px 5px;color:#fff;font-weight:700;font-size:11px"><span style="width:12px;height:12px;border-radius:50%;background:${c}"></span>${v}<span style="width:14px;height:14px;border-radius:50%;background:#2f9e44;display:grid;place-items:center;font-size:11px">+</span></div>`).join('')}</div></div>`},
{cat:'gpart',one:1,ko:'퀘스트 트래커, 퀘스트 알리미',en:'Quest Tracker',
 d:'진행 중인 퀘스트의 목표와 진행도를 화면 한쪽에 늘 보여 주는 작은 목록입니다. 메뉴를 열지 않아도 지금 무엇을 해야 하는지 알 수 있습니다.',
 ex:`<div class="gamebg">${hero(80,70)}<div style="position:absolute;right:8px;top:12px;width:130px;color:#fff;font-size:10.5px;text-shadow:0 1px 2px #000;display:flex;flex-direction:column;gap:6px"><div><b style="color:#ffd43b">늑대 사냥</b><div>숲 늑대 처치 3/5</div><div style="height:3px;background:rgba(0,0,0,.4)"><div style="width:60%;height:100%;background:#ffd43b"></div></div></div><div style="opacity:.85"><b>약초 채집</b><div>푸른 약초 10/10 ✓</div></div></div></div>`},
{cat:'gpart',one:1,ko:'웨이포인트와 목표 마커',en:'Waypoint & Objective Marker',
 d:'목적지나 목표물 위에 떠서 위치와 거리를 알려 주는 표시입니다. 목표가 화면 밖에 있으면 화면 가장자리에 화살표로 방향을 알려 줍니다.',
 vs:'같은 목표가 미니맵과 컴퍼스 바에도 함께 찍히는 경우가 많습니다. 플레이어가 직접 찍는 표식은 핑 마커입니다.',
 ex:`<div class="gamebg"><div style="position:absolute;left:96px;top:40px;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:10px;font-weight:700;text-shadow:0 1px 2px #000"><span style="width:14px;height:14px;background:#ffd43b;transform:rotate(45deg);box-shadow:0 0 0 2px #1f2430"></span><span style="margin-top:4px">120m</span></div><div style="position:absolute;right:4px;top:66px;display:flex;align-items:center;gap:3px;color:#fff;font-size:10px;font-weight:700;text-shadow:0 1px 2px #000">340m<span style="width:0;height:0;border:8px solid transparent;border-left:12px solid #74c0fc;border-right:0"></span></div>${hero(150,82)}</div>`},
{cat:'gpart',one:1,ko:'상호작용 프롬프트',en:'Interaction Prompt',
 d:'물체나 NPC 가까이 가면 뜨는 "눌러서 줍기", "길게 눌러 열기" 같은 안내입니다. 눌러야 할 버튼 그림(버튼 프롬프트)과 행동 이름을 함께 보여 주고, 길게 누르는 조작이면 차오르는 원으로 진행을 표시합니다.',
 vs:'이름이 비슷한 QTE 프롬프트는 연출 중에 제한 시간 안에 눌러야 하는 안내이고, 버튼 프롬프트(원칙 페이지의 입력 방식별 대응)는 쓰는 기기에 맞춰 버튼 그림을 바꿔 보여 주는 것입니다. 상호작용 프롬프트는 시간 제한 없이, 가까이 갔을 때 할 수 있는 행동을 알려 줍니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#4a2c30 0 70%,#6b5442 70%)">${hero(110,88)}<div style="position:absolute;left:170px;top:96px;width:36px;height:24px;border-radius:3px;background:#a87444;box-shadow:inset 0 -6px 0 #6e4528"></div><div style="position:absolute;left:150px;top:60px;display:flex;align-items:center;gap:6px;background:rgba(10,12,20,.75);color:#fff;border-radius:6px;padding:4px 8px;font-size:11px"><span style="position:relative;width:20px;height:20px;border-radius:50%;background:conic-gradient(#ffd43b calc(var(--hold)*360deg),rgba(255,255,255,.25) 0);animation:holdring 2.2s infinite;display:grid;place-items:center"><span class="key" style="min-width:12px;height:12px;font-size:8px">E</span></span>길게 눌러 열기</div></div>`},
{cat:'gpart',one:1,ko:'대화창과 초상화',en:'Dialogue Box & Portrait',anim:1,
 d:'캐릭터의 대사를 보여 주는 상자입니다. 말하는 사람의 이름표와 초상화(포트레이트)를 함께 두고, 글자가 한 자씩 찍히는 타이핑 효과와 "다음으로" 표시(▼)를 씁니다.',
 vs:'캐릭터 머리 위에 짧게 떴다 사라지는 대사는 바로 아래 말풍선입니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#5a7aa0 0 60%,#4a6a3a 60%)"><div style="position:absolute;left:8px;right:8px;bottom:8px;height:62px;background:rgba(18,20,30,.88);border:1.5px solid #c9a45a;border-radius:6px;color:#fff;padding:8px 10px 8px 66px"><div style="position:absolute;left:8px;top:-22px;width:50px;height:76px;border-radius:6px;background:linear-gradient(#3a4a6a,#1f2840);box-shadow:0 0 0 1.5px #c9a45a;overflow:hidden"><img src="img/ld/rozel_face.png" alt="" style="position:absolute;left:-22px;top:4px;width:94px"></div><b style="color:#ffd43b;font-size:11px">로젤</b><div style="font-size:11.5px;white-space:nowrap;overflow:hidden;width:100%;animation:type 2.6s steps(26) infinite">북쪽 숲에 늑대 무리가 나타났어요.</div><span style="position:absolute;right:8px;bottom:4px;font-size:9px;animation:blink 1s steps(1) infinite">▼</span></div></div>`},
{cat:'gpart',one:1,ko:'말풍선',en:'Speech Bubble / Bark',anim:1,
 d:'캐릭터 머리 위에 짧게 떴다 사라지는 대사입니다. 플레이를 멈추지 않고, 지나가는 NPC의 혼잣말이나 동료의 짧은 반응을 보여 줍니다.',
 vs:'바로 위 대화창은 화면 아래에 크게 떠서 대화가 끝날 때까지 플레이를 붙잡고, 말풍선은 움직이는 동안에도 저절로 떴다 사라집니다. 개발에서는 이런 짧은 혼잣말을 <b>바크(Bark)</b>라고 부르기도 합니다.',
 t:'여러 명이 동시에 말하면 겹치니, 가까운 캐릭터만 보여 주거나 차례로 띄웁니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#9fd0f0 0 60%,#7aa84a 60%)"><div style="position:absolute;left:150px;top:40px;width:70px;height:54px;background:#c98a5a;box-shadow:inset 0 0 0 3px #8a5a30"><div style="position:absolute;left:-8px;right:-8px;top:-18px;height:20px;background:#b04a3a;clip-path:polygon(50% 0,100% 100%,0 100%)"></div></div>${hero(70,78)}${hero(236,80)}<div style="position:absolute;left:81px;top:44px;transform-origin:50% 100%;animation:bbA 4s ease-out infinite"><div style="position:relative;transform:translateX(-50%);background:#fff;color:#1f2430;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:10px;white-space:nowrap;box-shadow:0 0 0 1.5px #1f2430">오늘 날씨 좋다!<i style="position:absolute;left:50%;bottom:-5px;width:8px;height:8px;margin-left:-4px;background:#fff;transform:rotate(45deg);box-shadow:1.5px 1.5px 0 #1f2430"></i></div></div><div style="position:absolute;left:247px;top:46px;transform-origin:50% 100%;animation:bbB 4s ease-out infinite"><div style="position:relative;transform:translateX(-50%);background:#fff;color:#1f2430;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:10px;white-space:nowrap;box-shadow:0 0 0 1.5px #1f2430">물고기가 안 잡혀<i style="position:absolute;left:50%;bottom:-5px;width:8px;height:8px;margin-left:-4px;background:#fff;transform:rotate(45deg);box-shadow:1.5px 1.5px 0 #1f2430"></i></div></div></div>`},
{cat:'gpart',one:1,ko:'선택지',en:'Dialogue Choices',
 d:'대화 중에 플레이어가 고를 수 있는 대답이나 행동 목록입니다. 지금 고른 것을 강조하고, 조건이 부족한 선택지는 자물쇠와 필요한 조건을 함께 보여 줍니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#5a7aa0 0 60%,#4a6a3a 60%)"><div style="position:absolute;right:12px;top:22px;width:190px;display:flex;flex-direction:column;gap:4px">${[['돕겠습니다.',1,''],['보상은 얼마죠?',0,''],['[설득 5] 마을 경비대가 나서야죠.',0,'lock'],['거절한다.',0,'']].map(([t,o,l])=>`<div style="background:${o?'#ffd43b':'rgba(18,20,30,.85)'};color:${o?'#2a2000':l?'#8a8f9c':'#fff'};border-radius:4px;padding:5px 8px;font-size:11px;display:flex;gap:5px;align-items:center;font-weight:${o?700:400}">${o?'▶':''}${l?LOCK:''}${t}</div>`).join('')}</div></div>`},
{cat:'gpart',one:1,ko:'라디얼 메뉴, 휠 메뉴',en:'Radial Menu / Weapon Wheel',
 d:'버튼을 누르고 있는 동안 원 모양으로 선택지가 펼쳐지고, 스틱이나 마우스를 그 방향으로 밀어 고르는 메뉴입니다. 패드로 많은 선택지를 빠르게 고를 수 있어서 무기 교체, 감정 표현에 많이 씁니다.',
 vs:'퀵슬롯은 늘 화면에 떠 있는 칸 줄이고, 라디얼 메뉴는 누를 때만 열리는 대신 더 많은 칸을 담습니다. 동료에게 신호를 보내는 원형 메뉴는 핑 휠이라고 따로 부릅니다.',
 ex:`<div class="gamebg"><div style="position:absolute;inset:0;background:rgba(10,12,20,.45)"></div><div style="position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;background:conic-gradient(from -22.5deg,rgba(255,212,59,.85) 0 45deg,rgba(18,20,30,.85) 45deg 360deg);-webkit-mask:radial-gradient(circle,transparent 0 37px,#000 38px);mask:radial-gradient(circle,transparent 0 37px,#000 38px)"></div>${[['#e5484d','sword'],['#3b5bdb','shield'],['#2f9e44','potion'],['#7048e8','gem'],['#868e96','sword'],['#a87444','shield'],['#c98a10','gem'],['#0ca678','potion']].map(([c,g],i)=>{const a=(i*45-90)*Math.PI/180;return`<div style="position:absolute;left:calc(50% + ${(Math.cos(a)*56).toFixed(1)}px);top:calc(50% + ${(Math.sin(a)*56).toFixed(1)}px);transform:translate(-50%,-50%)">${itm(c,g)}</div>`}).join('')}<b style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:10px;white-space:nowrap">화염의 검</b></div>`},
{cat:'gpart',one:1,ko:'타이틀 화면',en:'Title Screen',
 d:'게임을 켜면 처음 나오는 화면입니다. 게임 로고, 시작 안내("아무 버튼이나 누르세요") 또는 새 게임, 이어하기, 설정 메뉴, 그리고 구석에 버전 정보를 둡니다.',
 vs:'회사 로고가 나오는 첫 화면은 스플래시 스크린, 그 뒤에 로고와 메뉴가 있는 화면이 타이틀 화면입니다.',
 ex:`<div class="scr" style="background:radial-gradient(circle at 50% 30%,#4a3a7a,#120f1f);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><b style="font-family:var(--display);font-size:28px;letter-spacing:1px;text-shadow:0 3px 0 rgba(112,72,232,.75)">별빛 원정대</b>${['이어하기','새 게임','설정','종료'].map((x,i)=>`<span style="font-size:11px;${i?'opacity:.7':'color:#ffd43b;font-weight:700'}">${i?'':'▶ '}${x}</span>`).join('')}<span style="position:absolute;right:8px;bottom:6px;font:9px var(--mono);opacity:.5">v1.2.0</span></div>`},
{cat:'gpart',one:1,ko:'일시정지 메뉴',en:'Pause Menu',
 d:'플레이 도중 멈추고 여는 메뉴입니다. 게임 화면을 흐리거나 어둡게 둔 채로 "계속하기"를 가장 위에 두고, 설정, 도움말, 타이틀로 나가기 순으로 둡니다.',
 vs:'나가기처럼 진행 상황을 잃을 수 있는 메뉴는 확인 다이얼로그를 함께 씁니다.',
 ex:`<div class="gamebg">${hero(80,70)}${hero(200,80)}<div style="position:absolute;inset:0;background:rgba(10,12,20,.6);backdrop-filter:blur(1.5px)"></div><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:6px;align-items:center;color:#fff"><b style="font-size:14px;letter-spacing:2px;margin-bottom:4px">일시정지</b>${['계속하기','설정','도움말','타이틀로 나가기'].map((x,i)=>`<span style="width:120px;text-align:center;padding:4px;border-radius:4px;font-size:11px;${i?'background:rgba(255,255,255,.1)':'background:#ffd43b;color:#2a2000;font-weight:700'}">${x}</span>`).join('')}</div></div>`},
{cat:'gpart',one:1,ko:'세이브 슬롯',en:'Save Slots',
 d:'저장 파일 여러 개를 고르는 칸 목록입니다. 칸마다 장면 썸네일, 장(챕터)이나 위치, 플레이 시간, 저장한 날짜를 보여 줘서 어떤 저장인지 바로 알아보게 합니다.',
 ex:`<div class="scr" style="padding:10px;display:flex;flex-direction:column;gap:6px">${[['linear-gradient(#7fb2e0,#6a9a4a)','3장 북쪽 숲','12시간 40분','10월 26일 21:14'],['linear-gradient(#4a2c30,#6b5442)','2장 여관','8시간 02분','10월 20일 23:51']].map(([b,a,t,d])=>`<div class="panel" style="padding:6px;display:flex;gap:8px;align-items:center"><span style="width:50px;height:30px;border-radius:4px;background:${b};flex:none"></span><div style="flex:1"><b style="font-size:11px">${a}</b><div class="mut" style="font-size:10px">${t}</div></div><span class="mut" style="font-size:10px">${d}</span></div>`).join('')}<div class="panel" style="padding:10px;text-align:center;border:1.5px dashed var(--mln);box-shadow:none" class="mut"><span class="mut" style="font-size:11px">빈 슬롯</span></div></div>`},
{cat:'gpart',one:1,ko:'로딩 화면과 로딩 팁',en:'Loading Screen & Tips',
 d:'다음 장면을 불러오는 동안 보여 주는 화면입니다. 진행 바와 함께 게임 팁이나 세계관 글, 일러스트를 넣어 기다리는 시간을 덜 지루하게 만듭니다.',
 vs:'장면이 바뀌는 사이에 잠깐 끼워 넣는 그림이나 로고 화면은 아이캐치라고 부릅니다. 일본 애니메이션에서 광고 앞뒤로 나오는 짧은 그림을 부르던 말로, 게임에서는 챕터나 장소가 바뀔 때 1~2초 보여 주는 전환 그림을 가리킵니다. 로딩을 가리는 용도로도 씁니다.',
 ex:`<div class="scr" style="background:linear-gradient(135deg,#1f2a44,#3a2a4a);color:#fff"><div style="position:absolute;left:14px;top:14px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffd8a8,#e07050 60%,transparent 62%);opacity:.6"></div><div style="position:absolute;left:14px;right:14px;bottom:14px"><div style="font-size:10px;opacity:.7">팁</div><div style="font-size:11.5px;margin:2px 0 8px">방패 막기를 정확한 순간에 쓰면 적이 잠시 기절합니다.</div><div style="height:4px;border-radius:2px;background:rgba(255,255,255,.2)"><div style="width:64%;height:100%;border-radius:2px;background:#ffd43b"></div></div></div></div>`},
{cat:'gpart',one:1,ko:'스킬 트리',en:'Skill Tree',
 d:'스킬이나 특성을 선으로 이은 나무 모양의 성장 화면입니다. 앞 단계를 배워야 다음 칸이 열리고, 배운 칸, 지금 배울 수 있는 칸, 잠긴 칸을 모양과 밝기로 구분합니다.',
 ex:`<div class="scr" style="background:#1f2430"><svg width="300" height="160" style="position:absolute;left:0;top:0"><path d="M150 30L90 80M150 30L210 80M90 80L60 130M90 80L120 130M210 80L210 130" stroke="#5a6070" stroke-width="2"/><path d="M150 30L90 80L60 130" stroke="#ffd43b" stroke-width="2.5"/></svg>${[[150,30,2],[90,80,2],[210,80,1],[60,130,2],[120,130,1],[210,130,0]].map(([x,y,st])=>`<div style="position:absolute;left:${x-14}px;top:${y-14}px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:${st==2?'#ffd43b':st==1?'#3b5bdb':'#3a3f4c'};box-shadow:0 0 0 2px ${st==1?'#91a7ff':'transparent'};color:${st==2?'#2a2000':'#c5c9d3'}">${st?'':LOCK}</div>`).join('')}<span style="position:absolute;right:8px;bottom:6px;color:#c5c9d3;font-size:9.5px">노랑 배움, 파랑 배울 수 있음, 회색 잠김</span></div>`},
{cat:'gpart',one:1,ko:'레이더 차트, 육각형 그래프',en:'Radar Chart',
 d:'여러 능력치를 거미줄 모양 도형 위에 찍어 이은 그래프입니다. 캐릭터가 어떤 쪽에 강하고 약한지를 모양으로 한눈에 비교할 수 있습니다.',
 ex:`<div class="scr" style="display:grid;place-items:center">${(()=>{const L=['공격','방어','속도','체력','지능','행운'],V=[.9,.5,.75,.6,.3,.55],P=(r,i)=>[150+Math.cos((i*60-90)*Math.PI/180)*r,80+Math.sin((i*60-90)*Math.PI/180)*r];const ring=k=>L.map((_,i)=>P(62*k,i).join(',')).join(' ');return`<svg width="300" height="160">${[1,.66,.33].map(k=>`<polygon points="${ring(k)}" fill="none" stroke="#c5c9d3"/>`).join('')}<polygon points="${V.map((v,i)=>P(62*v,i).join(',')).join(' ')}" fill="rgba(59,91,219,.35)" stroke="#3b5bdb" stroke-width="2"/>${L.map((l,i)=>{const[x,y]=P(76,i);return`<text x="${x}" y="${y+3}" font-size="10" text-anchor="middle" fill="#1f2430">${l}</text>`}).join('')}</svg>`})()}</div>`},
{cat:'gpart',one:1,ko:'보상 팝업',en:'Reward Pop-up',anim:1,
 d:'퀘스트 완료, 레벨 업, 상자 열기 직후에 얻은 보상을 크게 보여 주는 창입니다. 뒤에서 도는 빛줄기, 아이템이 하나씩 튀어나오는 스태거 연출과 함께 씁니다.',
 vs:'게임에서는 이것도 팝업이라고 부르지만, 공지창이나 확인창과 달리 받은 것을 보여 주는 데만 씁니다. 팝업과 모달의 차이는 공통 컴포넌트의 팝업과 모달에 있습니다.',
 ex:`<div class="scr" style="background:#1a1430;display:grid;place-items:center;overflow:hidden"><div style="position:absolute;width:260px;height:260px;background:repeating-conic-gradient(rgba(255,212,59,.22) 0 10deg,transparent 10deg 30deg);border-radius:50%;animation:rays 8s linear infinite"></div><div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff"><b style="font-size:16px;color:#ffd43b;-webkit-text-stroke:2px #3a2000;paint-order:stroke fill">보상 획득!</b><div style="display:flex;gap:6px">${[['#c98a10','gem','300'],['#e5484d','potion','5'],['#7048e8','gem','1']].map(([c,g,n],i)=>`<div style="animation:appear 3s ${i*.12}s infinite both">${itm(c,g,n)}</div>`).join('')}</div><button class="btn" style="padding:4px 18px">받기</button></div></div>`},
{cat:'gpart',one:1,ko:'뽑기 연출, 가챠 연출',en:'Gacha / Loot Box Opening',anim:1,
 d:'뽑기(가챠)나 상자 결과를 극적으로 공개하는 연출입니다. 상자가 흔들리다 터지듯 열리고, 빛기둥과 함께 카드가 튀어나와 한 장씩 뒤집히며 등급이 드러납니다. 높은 등급일수록 빛, 크기, 이펙트를 더 크게 줍니다.',
 vs:'오른쪽 끝 카드처럼, 뒤집기 전에 높은 등급을 미리 알려 주는 연출은 흔하지만 업계 공통 이름은 없습니다. 보통은 확정 연출이라고 부르지만, 게임과 회사마다 다르게 부릅니다.',
 t:'흔들림(기대), 터짐(해소), 공개(보상) 세 박자로 나누면 짧아도 손맛이 납니다. 자주 여는 뽑기는 건너뛰기 버튼을 꼭 둡니다.',
 ex:`<div class="scr" style="background:radial-gradient(circle at 50% 62%,#3a2a6a,#120c22 70%);overflow:hidden"><div style="position:absolute;left:265px;top:74px;width:130px;height:130px;margin:-65px;border-radius:50%;background:repeating-conic-gradient(rgba(255,212,59,.35) 0 9deg,transparent 9deg 24deg);animation:lbrays 6s infinite,rays 6s linear infinite"></div><div class="lb" style="left:265px;top:74px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,212,59,.55),transparent 65%);animation:lbhalo 6s infinite"></div><div class="lb" style="top:104px;width:70px;height:200px;background:linear-gradient(transparent,rgba(255,200,60,.9) 65%,#fff0b0);filter:blur(2px);animation:lbpillar 6s infinite"></div><div class="lb" style="top:110px;width:60px;height:60px;border-radius:50%;box-shadow:0 0 0 3px #ffe08a,0 0 20px #ffd43b;animation:lbshock 6s infinite"></div><div class="lb" style="top:118px;transform:translate(-50%,-50%)"><div style="animation:lbbob 1.2s ease-in-out infinite"><div style="position:relative;width:66px;height:42px;animation:lbshake 6s infinite"><div style="position:absolute;inset:0;border-radius:5px;background:linear-gradient(#e0a030,#b06a10);box-shadow:inset 0 0 0 2.5px #6a3a08,0 6px 10px rgba(0,0,0,.4);animation:lbbody 6s infinite"><div style="position:absolute;left:28px;top:10px;width:10px;height:14px;border-radius:2px;background:#ffe08a;box-shadow:0 0 0 2px #6a3a08"></div></div><div style="position:absolute;left:-4px;right:-4px;top:-3px;height:5px;border-radius:3px;background:#fff6d0;filter:blur(2px);animation:lbleak 6s infinite"></div><div style="position:absolute;left:-4px;top:-14px;width:74px;height:16px;border-radius:5px 5px 2px 2px;background:linear-gradient(#f2b84a,#c27a18);box-shadow:inset 0 0 0 2.5px #6a3a08;animation:lblid 6s infinite"></div></div></div></div><div class="lbcard" style="animation:lbc0 6s cubic-bezier(.2,.9,.3,1.2) infinite"><div class="in" style="animation:lbf0 6s infinite"><div class="f fr" style="animation:lbg0 6s infinite"><img src="img/sd/char_125.png" alt="" style="width:40px;height:40px;margin:-8px 0 -6px;image-rendering:pixelated;filter:drop-shadow(0 0 4px #adb5bd)"><span style="color:#adb5bd">일반</span></div><div class="f bk"><span style="width:14px;height:14px;transform:rotate(45deg);border:2px solid #b8a8ff"></span></div></div></div><div class="lbcard" style="animation:lbc1 6s cubic-bezier(.2,.9,.3,1.2) infinite"><div class="in" style="animation:lbf1 6s infinite"><div class="f fr" style="animation:lbg1 6s infinite"><img src="img/sd/char_117.png" alt="" style="width:40px;height:40px;margin:-8px 0 -6px;image-rendering:pixelated;filter:drop-shadow(0 0 4px #4dabf7)"><span style="color:#4dabf7">희귀</span></div><div class="f bk"><span style="width:14px;height:14px;transform:rotate(45deg);border:2px solid #b8a8ff"></span></div></div></div><div class="lbcard" style="animation:lbc2 6s cubic-bezier(.2,.9,.3,1.2) infinite"><div class="in" style="animation:lbf2 6s infinite"><div class="f fr" style="animation:lbg2 6s infinite"><img src="img/sd/char_120.png" alt="" style="width:40px;height:40px;margin:-8px 0 -6px;image-rendering:pixelated;filter:drop-shadow(0 0 4px #b197fc)"><span style="color:#b197fc">영웅</span></div><div class="f bk"><span style="width:14px;height:14px;transform:rotate(45deg);border:2px solid #b8a8ff"></span></div></div></div><div class="lbcard" style="animation:lbc3 6s cubic-bezier(.2,.9,.3,1.2) infinite"><div class="in" style="animation:lbf3 6s infinite"><div class="f fr" style="animation:lbg3 6s infinite"><img src="img/sd/char_133.png" alt="" style="width:40px;height:40px;margin:-8px 0 -6px;image-rendering:pixelated;filter:drop-shadow(0 0 4px #ffd43b)"><span style="color:#ffd43b">전설</span></div><div class="f bk" style="animation:lbtease 6s infinite"><span style="width:14px;height:14px;transform:rotate(45deg);border:2px solid #b8a8ff"></span></div></div></div><div style="position:absolute;inset:0;animation:lbgate 6s infinite"><i style="position:absolute;left:249px;top:92px;width:3px;height:3px;border-radius:50%;background:#ffe08a;box-shadow:0 0 5px #ffd43b;--dx:-8px;animation:lbrise 1.1s 0s linear infinite"></i><i style="position:absolute;left:259px;top:92px;width:3px;height:3px;border-radius:50%;background:#ffe08a;box-shadow:0 0 5px #ffd43b;--dx:-3px;animation:lbrise 1.1s 0.15s linear infinite"></i><i style="position:absolute;left:269px;top:92px;width:3px;height:3px;border-radius:50%;background:#ffe08a;box-shadow:0 0 5px #ffd43b;--dx:5px;animation:lbrise 1.1s 0.3s linear infinite"></i><i style="position:absolute;left:279px;top:92px;width:3px;height:3px;border-radius:50%;background:#ffe08a;box-shadow:0 0 5px #ffd43b;--dx:9px;animation:lbrise 1.1s 0.08s linear infinite"></i><i style="position:absolute;left:254px;top:92px;width:3px;height:3px;border-radius:50%;background:#ffe08a;box-shadow:0 0 5px #ffd43b;--dx:-12px;animation:lbrise 1.1s 0.22s linear infinite"></i><i style="position:absolute;left:274px;top:92px;width:3px;height:3px;border-radius:50%;background:#ffe08a;box-shadow:0 0 5px #ffd43b;--dx:12px;animation:lbrise 1.1s 0.38s linear infinite"></i></div><i style="position:absolute;left:265px;top:74px;width:4px;height:4px;border-radius:50%;background:#fff3a0;box-shadow:0 0 6px #ffd43b;--dx:-34px;--dy:-34px;animation:lbspark 6s infinite"></i><i style="position:absolute;left:265px;top:74px;width:4px;height:4px;border-radius:50%;background:#fff3a0;box-shadow:0 0 6px #ffd43b;--dx:0px;--dy:-46px;animation:lbspark 6s infinite"></i><i style="position:absolute;left:265px;top:74px;width:4px;height:4px;border-radius:50%;background:#fff3a0;box-shadow:0 0 6px #ffd43b;--dx:34px;--dy:-34px;animation:lbspark 6s infinite"></i><i style="position:absolute;left:265px;top:74px;width:4px;height:4px;border-radius:50%;background:#fff3a0;box-shadow:0 0 6px #ffd43b;--dx:46px;--dy:0px;animation:lbspark 6s infinite"></i><i style="position:absolute;left:265px;top:74px;width:4px;height:4px;border-radius:50%;background:#fff3a0;box-shadow:0 0 6px #ffd43b;--dx:34px;--dy:34px;animation:lbspark 6s infinite"></i><i style="position:absolute;left:265px;top:74px;width:4px;height:4px;border-radius:50%;background:#fff3a0;box-shadow:0 0 6px #ffd43b;--dx:0px;--dy:46px;animation:lbspark 6s infinite"></i><i style="position:absolute;left:265px;top:74px;width:4px;height:4px;border-radius:50%;background:#fff3a0;box-shadow:0 0 6px #ffd43b;--dx:-34px;--dy:34px;animation:lbspark 6s infinite"></i><i style="position:absolute;left:265px;top:74px;width:4px;height:4px;border-radius:50%;background:#fff3a0;box-shadow:0 0 6px #ffd43b;--dx:-46px;--dy:0px;animation:lbspark 6s infinite"></i><i style="position:absolute;left:146px;top:112px;width:4px;height:4px;border-radius:50%;background:#ffd43b;box-shadow:0 0 6px #ffd43b;transform-origin:center;animation:lbpour 6s 0s infinite"></i><i style="position:absolute;left:154px;top:112px;width:3px;height:3px;border-radius:50%;background:#ffd43b;box-shadow:0 0 6px #ffd43b;transform-origin:center;animation:lbpour 6s 0.05s infinite"></i><i style="position:absolute;left:162px;top:112px;width:5px;height:5px;border-radius:50%;background:#ffd43b;box-shadow:0 0 6px #ffd43b;transform-origin:center;animation:lbpour 6s 0.02s infinite"></i><i style="position:absolute;left:170px;top:112px;width:3px;height:3px;border-radius:50%;background:#ffd43b;box-shadow:0 0 6px #ffd43b;transform-origin:center;animation:lbpour 6s 0.08s infinite"></i><i style="position:absolute;left:176px;top:112px;width:4px;height:4px;border-radius:50%;background:#ffd43b;box-shadow:0 0 6px #ffd43b;transform-origin:center;animation:lbpour 6s 0.04s infinite"></i><i style="position:absolute;left:158px;top:112px;width:3px;height:3px;border-radius:50%;background:#ffd43b;box-shadow:0 0 6px #ffd43b;transform-origin:center;animation:lbpour 6s 0.1s infinite"></i><div style="position:absolute;inset:0;background:#fffbe8;pointer-events:none;animation:lbflash 6s infinite"></div></div>`},
{cat:'gpart',one:1,ko:'확률표',en:'Drop Rate Table',
 d:'뽑기나 확률형 상자에서 각 등급과 아이템이 나올 확률을 적은 표입니다. 등급별 확률과 함께, 같은 등급 안의 개별 아이템 확률, 천장(일정 횟수 안에 반드시 나오는 보장)이 있다면 그 조건도 적습니다.',
 t:'한국은 게임산업법 개정(2024년 3월 시행)으로, 유료로 구매하는 확률형 아이템(유료 재화를 거쳐 간접적으로 사는 것 포함)의 확률 공개가 의무가 됐습니다. 무료로만 얻는 아이템은 대상이 아니지만, 자세한 범위는 법령과 관련 안내를 확인해야 합니다.',
 ex:`<div class="scr" style="padding:10px 14px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>영웅 소환 확률</b><span class="mut" style="font-size:10px">90회 안에 전설 1회 보장</span></div><div class="panel" style="margin-top:6px;font-size:11px;overflow:hidden">${[['전설','1.5%','#c98a10'],['희귀','13.5%','#3b5bdb'],['일반','85%','#868e96']].map(([g,v,c],i)=>`<div style="display:grid;grid-template-columns:52px 1fr 46px;align-items:center;gap:8px;padding:5px 8px;${i?'border-top:1px solid var(--mln)':''}"><b style="color:${c}">${g}</b><span style="height:6px;border-radius:3px;background:var(--mbg);overflow:hidden"><i style="display:block;height:100%;width:${parseFloat(v)}%;min-width:2px;background:${c}"></i></span><b style="text-align:right;font-variant-numeric:tabular-nums">${v}</b></div>`).join('')}</div><div class="mut" style="font-size:9.5px;margin-top:5px">전설 영웅 6종은 각각 0.25%</div></div>`},
{cat:'gpart',one:1,ko:'배틀패스 트랙',en:'Battle Pass Track',
 d:'시즌 동안 경험치를 모아 단계를 올리면 보상을 받는 가로 줄 모양의 화면입니다. 위 줄은 누구나 받는 무료 보상, 아래 줄은 구매한 사람만 받는 프리미엄 보상으로 나뉩니다.',
 ex:`<div class="scr" style="background:#1f2430;padding:10px;color:#fff"><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:6px"><b>시즌 3</b><span>12단계 / 다음 단계까지 340 XP</span></div><div style="display:grid;grid-template-columns:42px repeat(5,1fr);gap:5px;align-items:center;font-size:9.5px"><span class="mut">무료</span>${[1,1,1,0,0].map((g,i)=>`<div style="position:relative;justify-self:center">${itm(['#c98a10','#2f9e44','#e5484d','#3b5bdb','#7048e8'][i],['gem','potion','sword','shield','gem'][i])}${g?'<span style="position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:6px;display:grid;place-items:center;color:#51cf66;font-weight:700">✓</span>':''}</div>`).join('')}<span style="color:#ffd43b">프리미엄</span>${[0,0,0,0,0].map((g,i)=>`<div style="position:relative;justify-self:center">${itm(['#7048e8','#e5484d','#c98a10','#be4bdb','#ffd43b'][i],['gem','sword','gem','shield','gem'][i])}<span style="position:absolute;inset:0;background:rgba(0,0,0,.55);border-radius:6px;display:grid;place-items:center;color:#c5c9d3">${LOCK}</span></div>`).join('')}<span></span>${[10,11,12,13,14].map((n,i)=>`<span style="text-align:center;${n==12?'color:#ffd43b;font-weight:700':'opacity:.6'}">${n}</span>`).join('')}</div><div style="height:4px;margin:4px 0 0 47px;border-radius:2px;background:rgba(255,255,255,.15)"><div style="width:52%;height:100%;background:#ffd43b;border-radius:2px"></div></div></div>`},
{cat:'gpart',one:1,ko:'피격 인디케이터, 데미지 인디케이터',en:'Damage Direction Indicator',anim:1,
 d:'어디서 공격받았는지 화면 가장자리나 조준점 주변의 붉은 호(활 모양)로 알려 주는 표시입니다. 3인칭이나 1인칭 게임에서 보이지 않는 곳의 적을 찾게 해 줍니다.',
 vs:'화면 가장자리 전체가 붉게 물드는 것은 바로 아래 피격 비네트입니다. 피격 비네트는 맞았다는 사실만, 피격 인디케이터는 어느 쪽에서 맞았는지까지 알려 줍니다. 내가 적을 맞혔을 때 뜨는 것은 히트 마커입니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#5a7aa0 0 55%,#4a5a3a 55%)"><span style="position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000"></span>${[['-90','0'],['35','.4']].map(([a,d])=>`<div style="position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px;border-radius:50%;border:5px solid transparent;border-top-color:#ff3b3b;filter:drop-shadow(0 0 4px #ff3b3b);transform:rotate(${a}deg);animation:hitarc 2s ${d}s infinite"></div>`).join('')}</div>`},
{cat:'gpart',one:1,ko:'피격 비네트',en:'Damage Vignette',anim:1,
 d:'맞았을 때 화면 가장자리 전체가 붉게 번쩍이고, 체력이 낮아지면 가장자리가 붉게 맥박 치듯 물드는 효과입니다. 어디서 맞았는지는 알려 주지 않고, 맞았다는 사실과 위험한 상태를 알려 줍니다.',
 vs:'어느 쪽에서 맞았는지까지 알려 주는 것은 바로 위 피격 인디케이터입니다. 화면 가장자리를 어둡게 하거나 물들이는 기법 자체는 <b>비네트(Vignette)</b>라고 부릅니다.',
 t:'오래 가리면 정작 위험할 때 앞이 안 보입니다. 세기를 줄이거나 끌 수 있는 옵션을 둡니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#5a7aa0 0 55%,#4a5a3a 55%)"><div style="position:absolute;left:200px;top:70px;width:30px;height:36px;border-radius:50% 50% 20% 20%;background:#7a3a3a"></div><span style="position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000"></span><div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(200,10,10,.55) 72%,rgba(150,0,0,.92));animation:vgHit 3s infinite"></div><div style="position:absolute;left:10px;bottom:10px;width:90px;height:7px;border-radius:2px;background:rgba(0,0,0,.45);overflow:hidden"><div style="height:100%;background:#e5484d;animation:vgHp 3s infinite"></div></div></div>`},
{cat:'gpart',one:1,ko:'컴퍼스 바, 나침반 바',en:'Compass Bar',
 d:'화면 맨 위에 가로로 길게 깔린 나침반 띠입니다. 바라보는 방향이 띠 가운데에 오고, 목표, 마을, 동료 같은 표식이 띠 위의 해당 방향에 붙습니다. 미니맵 대신 쓰는 경우가 많습니다. 배틀그라운드처럼 띠에 0~360 숫자가 찍혀 있으면 이 숫자를 방위각이라고 하고, "방위 135"처럼 위치를 알리는 데 씁니다.',
 vs:'미니맵은 주변 지형까지 보여 주고, 컴퍼스 바는 방향만 보여 주는 대신 화면을 덜 가립니다. 웨이포인트와 핑 마커도 띠 위에 함께 찍힙니다.',
 ex:`<div class="gamebg"><div style="position:absolute;left:30px;right:30px;top:10px;height:24px;background:linear-gradient(90deg,transparent,rgba(10,12,20,.6) 15% 85%,transparent);color:#fff;overflow:hidden">${['남서','서','북서','북','북동','동','남동'].map((x,i)=>`<b style="position:absolute;left:${i*40}px;top:5px;width:40px;text-align:center;font-size:10px;${x=='북'?'color:#ffd43b':''}">${x}</b>`).join('')}${Array.from({length:28},(_,i)=>`<i style="position:absolute;left:${i*10}px;bottom:0;width:1px;height:${i%4?3:6}px;background:rgba(255,255,255,.6)"></i>`).join('')}<span style="position:absolute;left:162px;top:2px;width:8px;height:8px;background:#ffd43b;transform:rotate(45deg)"></span><span style="position:absolute;left:206px;top:3px;width:7px;height:7px;border-radius:50%;background:#51cf66"></span></div><i style="position:absolute;left:50%;top:34px;margin-left:-4px;border:4px solid transparent;border-top:6px solid #fff;border-bottom:0"></i>${hero(140,80)}</div>`},
{cat:'gpart',one:1,ko:'버프창, 버프 바',en:'Status Effect Tray',
 d:'지금 걸려 있는 강화 효과(버프)와 약화 효과(디버프) 아이콘을 늘어놓은 줄입니다. 아이콘마다 남은 시간과 중첩 횟수를 보여 줍니다. 디버프는 붉은 테두리로 구분하거나, 트레이를 따로 나눠 버프와 다른 위치에 둡니다. 영어 이름을 따라 <b>상태 효과 트레이(Status Effect Tray)</b>라고도 부릅니다.',
 ex:`<div class="gamebg">${hero(140,86)}<div style="position:absolute;left:10px;top:10px;display:flex;gap:5px">${[['#2f9e44','potion','12s','',''],['#3b5bdb','shield','30s','',''],['#c98a10','gem','2:10','3',''],['#7048e8','gem','5s','','d'],['#e5484d','sword','8s','2','d']].map(([c,g,t,n,d])=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="transform:scale(.8);${d?'outline:2px solid #ff3b3b;outline-offset:1px;border-radius:6px':''}">${itm(c,g,n)}</div><b style="font:700 8.5px var(--mono);color:#fff;text-shadow:0 0 2px #000">${t}</b></div>`).join('')}</div></div>`},
{cat:'gpart',one:1,ko:'캐스트 바, 시전 바',en:'Cast Bar',anim:1,
 d:'주문이나 기술을 쓰기까지 걸리는 시전 시간을 보여 주는 진행 막대입니다. 적의 시전 바를 보고 끊을지 피할지 정하고, 끊을 수 없는 시전은 방패 아이콘이나 회색 막대로 구분합니다.',
 vs:'쿨타임은 기술을 쓴 뒤 다시 쓸 수 있을 때까지 기다리는 시간입니다. 캐스트 바는 쓰기 전, 쿨타임은 쓴 뒤의 기다림입니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#2a1a2a,#4a2a3a)">${hero(70,92)}<div style="position:absolute;left:120px;top:30px;width:150px;color:#fff;font-size:10px"><div style="display:flex;justify-content:space-between"><b>지옥불 폭발</b><span>끊을 수 있음</span></div><div style="height:9px;margin-top:2px;background:rgba(0,0,0,.5);border:1px solid #c9a45a"><div style="height:100%;background:linear-gradient(90deg,#ffa94d,#ff6b6b);animation:castfill 3s linear infinite"></div></div></div><div style="position:absolute;left:120px;top:66px;width:150px;color:#fff;font-size:10px;opacity:.85"><div style="display:flex;justify-content:space-between"><b>대지 분쇄</b><span>${G.shield.replace('width="18" height="18"','width="10" height="10"')} 끊을 수 없음</span></div><div style="height:9px;margin-top:2px;background:rgba(0,0,0,.5);border:1px solid #868e96"><div style="height:100%;background:#868e96;animation:castfill 4s linear infinite"></div></div></div></div>`},
{cat:'gpart',one:1,ko:'킬 피드',en:'Kill Feed',anim:1,
 d:'화면 한쪽 구석에 누가 누구를 쓰러뜨렸는지 한 줄씩 쌓이는 알림입니다. 처치한 사람, 쓴 무기 아이콘, 쓰러진 사람 순서로 쓰고 팀 색으로 구분합니다.',
 vs:'토스트나 업적 알림은 하나씩 떴다 사라지지만, 킬 피드는 새 줄이 계속 쌓이고 오래된 줄부터 사라집니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#5a7aa0 0 55%,#4a5a3a 55%)"><div style="position:absolute;right:8px;top:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-end">${[['로젤','#4dabf7','렌카','#ff6b6b',0],['도르카','#ff6b6b','하이렌','#4dabf7',.6],['로젤','#4dabf7','카르민','#ff6b6b',1.2]].map(([a,ca,b,cb,d])=>`<div style="display:flex;align-items:center;gap:5px;background:rgba(10,12,20,.6);padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;animation:killin 3s ${d}s infinite both"><span style="color:${ca}">${a}</span><span style="color:#fff">⚔</span><span style="color:${cb}">${b}</span></div>`).join('')}</div></div>`},
{cat:'gpart',one:1,ko:'스코어보드',en:'Scoreboard',
 d:'경기 중에 버튼을 누르고 있는 동안 뜨는 점수표입니다. 팀별로 플레이어의 처치, 죽음, 도움(K/D/A) 같은 기록을 보여 주고, 내 줄은 강조합니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#5a7aa0 0 55%,#4a5a3a 55%)"><div style="position:absolute;inset:12px 30px;background:rgba(10,12,20,.82);border-radius:6px;padding:6px 8px;color:#fff;font-size:10px"><div style="display:grid;grid-template-columns:1fr 26px 26px 26px;gap:4px;opacity:.6"><span>이름</span><span>K</span><span>D</span><span>A</span></div>${[['로젤',12,3,5,'#4dabf7',1],['하이렌',8,6,9,'#4dabf7',0],['도르카',10,7,2,'#ff6b6b',0],['렌카',4,9,6,'#ff6b6b',0]].map(([n,k,d,a,c,me],i)=>`<div style="display:grid;grid-template-columns:1fr 26px 26px 26px;gap:4px;padding:3px 0;${i==2?'border-top:1px solid rgba(255,255,255,.2);margin-top:3px':''};${me?'background:rgba(255,212,59,.18)':''}"><b style="color:${c}">${n}</b><span>${k}</span><span>${d}</span><span>${a}</span></div>`).join('')}</div></div>`},
{cat:'gpart',one:1,ko:'원형 스태미나 게이지, 스태미나 휠',en:'Stamina Wheel',anim:1,
 d:'달리기나 오르기처럼 기력을 쓰는 동안만 캐릭터 옆에 나타나는 동그란 기력 표시입니다. 다 쓰면 색이 바뀌고, 다 차면 사라져서 평소에는 화면을 가리지 않습니다. <b>스태미나 휠</b>이라고도 부릅니다.',
 ex:`<div class="gamebg">${hero(140,80)}<div style="position:absolute;left:170px;top:62px;width:26px;height:26px;border-radius:50%;background:conic-gradient(#51cf66 calc(var(--st)*360deg),rgba(0,0,0,.35) 0);-webkit-mask:radial-gradient(circle,transparent 0 7px,#000 8px);mask:radial-gradient(circle,transparent 0 7px,#000 8px);animation:stam 3.5s ease-in-out infinite"></div></div>`},
{cat:'gpart',one:1,ko:'조준점 벌어짐, 블룸',en:'Reticle Bloom / Spread',anim:1,
 d:'움직이거나 연달아 쏘면 조준점이 벌어졌다가, 멈추면 다시 모이는 표현입니다. 지금 쏘면 총알이 얼마나 퍼지는지를 조준점 크기로 알려 줍니다.',
 vs:'<b>스프레이(탄퍼짐)</b>는 연사할 때 총알이 퍼져서 박히는 모양 자체를 말합니다. 총마다 퍼지는 모양이 정해져 있으면 <b>스프레이 패턴</b>이라고 부르고, 조준점 벌어짐은 이 퍼짐을 미리 보여 주는 UI입니다.',
 ex:`<div class="scr" style="background:linear-gradient(#5a7aa0 0 60%,#4a5a3a 60%)"><div style="position:absolute;left:50%;top:50%;width:100px;height:80px;margin:-40px 0 0 -50px;background:repeating-linear-gradient(#8a6a4a 0 9px,#7a5a3a 9px 10px);border-radius:2px"></div>${[[1,-1],[-4,3],[5,-5],[-9,-6],[9,7],[-6,10],[12,-10]].map(([x,y],i)=>`<i style="position:absolute;left:calc(50% + ${x}px);top:calc(50% + ${y}px);width:4px;height:4px;margin:-2px;border-radius:50%;background:#1a1a1a;box-shadow:0 0 0 1px rgba(255,240,200,.7);animation:holepop 1.6s ${(i*.07).toFixed(2)}s infinite both"></i>`).join('')}<span style="position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px">${[['left:16px;top:0;width:2px;height:9px','bloomU'],['left:16px;bottom:0;width:2px;height:9px','bloomD'],['top:16px;left:0;width:9px;height:2px','bloomL'],['top:16px;right:0;width:9px;height:2px','bloomR']].map(([st,a])=>`<i style="position:absolute;${st};background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);animation:${a} 1.6s ease-out infinite"></i>`).join('')}</span><span style="position:absolute;left:10px;bottom:8px;color:#fff;font-size:10px">연사할수록 벌어지고, 멈추면 모입니다</span></div>`},
{cat:'gpart',one:1,ko:'핑 시스템, 핑 휠',en:'Ping System / Ping Wheel',
 d:'말하지 않고도 동료에게 위치, 적, 아이템을 알리는 신호 기능입니다. 버튼을 누른 채 방향을 고르는 작은 원형 메뉴(핑 휠)로 "적 발견", "이쪽으로", "조심" 같은 신호를 고르면 게임 세계와 지도에 표식이 꽂힙니다. 이 표식은 <b>핑 마커, 핀, 맵 마커</b>라고도 부릅니다.',
 vs:'웨이포인트와 목표 마커는 게임이 띄워 주는 것이고, 핑 마커는 플레이어가 직접 찍어 동료에게 보여 주는 것입니다. 찍은 표식은 미니맵과 컴퍼스 바에도 함께 뜹니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#5a7aa0 0 55%,#4a5a3a 55%)"><div style="position:absolute;left:206px;top:48px;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:9.5px;font-weight:700;text-shadow:0 1px 2px #000"><span style="width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ff6b6b;box-shadow:0 0 0 2px #fff"></span><span style="margin-top:3px">적 발견 42m</span></div><div style="position:absolute;left:70px;top:80px;width:96px;height:96px;margin:-48px;border-radius:50%;background:conic-gradient(from -45deg,rgba(255,107,107,.85) 0 90deg,rgba(18,20,30,.8) 90deg 360deg);-webkit-mask:radial-gradient(circle,transparent 0 16px,#000 17px);mask:radial-gradient(circle,transparent 0 16px,#000 17px)"></div>${[['적 발견',0],['이쪽으로',90],['조심',180],['도움',270]].map(([t,a])=>{const r=(a-90)*Math.PI/180;return`<b style="position:absolute;left:${70+Math.cos(r)*33}px;top:${80+Math.sin(r)*33}px;transform:translate(-50%,-50%);color:#fff;font-size:9px;white-space:nowrap">${t}</b>`}).join('')}</div>`},
{cat:'gpart',one:1,ko:'QTE 프롬프트',en:'Quick Time Event Prompt',anim:1,
 d:'연출 장면 중에 제한 시간 안에 특정 버튼을 누르라고 띄우는 안내입니다. 줄어드는 고리로 남은 시간을 보여 주고, "연타", "길게 누르기"처럼 누르는 방식을 함께 적습니다.',
 vs:'<b>QTE</b>는 Quick Time Event의 줄임말입니다. 자주 쓰면 "영상 보다가 버튼 누르기"가 된다는 비판도 많아서, 실패해도 크게 벌받지 않게 만드는 경우가 많습니다. 상호작용 프롬프트는 시간 제한 없이 가까이 갔을 때 할 수 있는 행동을 알려 주는 안내라 다릅니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#2a1a2a,#4a2a3a)"><div style="position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;border:3px solid #ffd43b;animation:qtering 1.4s linear infinite"></div><span class="pad" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;font-size:16px;background:#2f9e44;box-shadow:0 0 0 3px #fff">A</span><b style="position:absolute;left:0;right:0;top:128px;text-align:center;color:#fff;font-size:13px;-webkit-text-stroke:2px #1f2430;paint-order:stroke fill">연타!</b></div>`},
{cat:'gpart',one:1,ko:'컷인',en:'Cut-in',anim:1,
 d:'궁극기 같은 특수 스킬을 쓰는 순간, 캐릭터 얼굴이나 상반신이 들어간 띠가 화면을 가로지르며 잠깐 지나가는 연출입니다. 배경을 어둡게 하고 기술 이름을 크게 띄워서 지금 큰 기술이 나간다는 것을 알립니다.',
 vs:'게임이 멈추고 화면 전체에 영상이 나오면 바로 아래 스킬 컷신입니다. 컷인은 전투가 이어지는 중에 1초 안팎으로 겹쳐 지나갑니다.',

 d:'공격을 고르기 전에 그 공격이 맞으면 적의 체력이 얼마나 줄어드는지 체력 바에 미리 깜박이며 보여 주는 표시입니다. 명중률, 반격 피해와 함께 보여 줘서 결과를 예측하고 고르게 합니다. 영어 이름 그대로 <b>데미지 프리뷰</b>라고도 부릅니다.',
 vs:'고르기 전에 결과를 미리 보여 준다는 점에서 장비 비교 툴팁(원칙 페이지)과 같은 생각입니다. 장비 비교는 능력치를, 데미지 예측은 전투 결과를 보여 줍니다.',
 ex:`<div class="scr" style="background:#1f2430;color:#fff;padding:12px"><div style="display:flex;justify-content:space-between;align-items:center"><b>숲 늑대</b><span style="font-size:10px">명중률 <b style="color:#51cf66">85%</b></span></div><div style="position:relative;height:12px;margin-top:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden"><div style="position:absolute;left:0;top:0;bottom:0;width:70%;background:#e5484d"></div><div style="position:absolute;left:38%;top:0;bottom:0;width:32%;background:#ffe08a;animation:dmgflash 1s infinite"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;margin-top:3px;opacity:.85"><span>체력 70 → 38</span><span>예상 피해 32</span></div><div class="panel" style="margin-top:12px;padding:6px 8px;background:rgba(255,255,255,.06);color:#fff;font-size:10.5px;box-shadow:none;display:flex;justify-content:space-between"><span>반격 피해 예상</span><b style="color:#ff8787">12</b></div></div>`},
{cat:'gpart',one:1,ko:'턴 순서 바, 턴 오더',en:'Turn Order / Initiative Tracker',
 d:'턴제 전투에서 누가 어떤 순서로 행동하는지 초상화를 줄 세워 보여 주는 표시입니다. 지금 행동하는 캐릭터는 크게, 적은 붉은 테두리로 구분하고, 다음 몇 턴의 순서까지 미리 보여 줍니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#4a3a5a,#2a2234)"><div style="position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:flex-end;gap:6px">${[[101,0,1],['#7a3a6a',1,0],[112,0,0],['#7a3a6a',1,0],[120,0,0],[105,0,0]].map(([c,e,now],i)=>{const B=now?40:28,k=B*1.9/64;return`<div style="position:relative;width:${B}px;height:${B}px;border-radius:6px;overflow:hidden;background:${e?c:'#2a3a5a'};box-shadow:0 0 0 2px ${e?'#ff6b6b':now?'#ffd43b':'#adb5bd'};flex:none">${e?`<i style="position:absolute;left:30%;top:38%;width:12%;height:12%;border-radius:50%;background:#ffd43b;box-shadow:${B*.28}px 0 0 #ffd43b"></i>`:`<img src="${SD(c)}" alt="" style="position:absolute;left:${B/2-30.5*k}px;top:${-20*k}px;width:${64*k}px;image-rendering:pixelated">`}</div>${i==0?'<span style="color:#fff;font-size:10px;margin-left:-2px">▶</span>':''}`}).join('')}</div><span style="position:absolute;left:12px;top:60px;color:#ffd43b;font-size:10px;font-weight:700">로젤의 차례</span></div>`},
{cat:'gpart',one:1,ko:'키워드 툴팁, 중첩 툴팁',en:'Keyword / Nested Tooltip',

{cat:'gpart',one:1,ko:'이동 범위 하이라이트',en:'Movement & Attack Range Overlay',
 d:'전략 게임에서 유닛을 고르면 갈 수 있는 칸은 파랑으로, 그 너머 공격할 수 있는 칸은 빨강으로 바닥에 칠해 주는 표시입니다. 이동 경로를 화살표로 미리 그려 주기도 합니다.',
 ex:`<div class="scr" style="background:#3a4a2a;display:grid;place-items:center"><div style="display:grid;grid-template-columns:repeat(9,16px);grid-auto-rows:16px;gap:1px">${Array.from({length:63},(_,i)=>{const x=i%9-4,y=Math.floor(i/9)-3,d=Math.abs(x)+Math.abs(y);return`<span style="background:${d==0?'#ffd43b':d<=2?'rgba(77,171,247,.75)':d==3?'rgba(255,107,107,.6)':'#4a5a3a'};border-radius:2px;${d==0?'box-shadow:inset 0 0 0 3px #3f6a93':''}"></span>`}).join('')}</div></div>`},
{cat:'gpart',one:1,ko:'손패, 카드 부채, 핸드',en:'Card Hand Fan',

 ex:`<div class="scr" style="background:radial-gradient(circle at 50% 120%,#3a2a5a,#1a1430)">${[-24,-12,0,12,24].map((a,i)=>`<div style="position:absolute;left:${160-23+a*2.7}px;top:${i==2?40:78+Math.abs(a)*.6}px;width:46px;height:64px;border-radius:5px;background:linear-gradient(#f4ead4 0 55%,${['#e5484d','#3b5bdb','#c98a10','#2f9e44','#7048e8'][i]} 55%);box-shadow:0 0 0 1.5px ${i==2?'#ffd43b':'#3a2418'},0 4px 8px rgba(0,0,0,.4);transform:rotate(${i==2?0:a}deg) scale(${i==2?1.22:1});transform-origin:50% 120%;${i==4?'filter:brightness(.5)':''};z-index:${i==2?5:i}"><b style="position:absolute;left:4px;top:3px;width:13px;height:13px;border-radius:50%;background:#3b5bdb;color:#fff;font-size:8px;display:grid;place-items:center">${[1,2,1,3,5][i]}</b></div>`).join('')}</div>`},
{cat:'gpart',one:1,ko:'테트리스식 인벤토리',en:'Spatial / Grid-based Inventory',
 d:'아이템마다 크기가 달라서 가방 격자에서 차지하는 칸 수가 다른 인벤토리입니다. 긴 검은 세로 세 칸, 갑옷은 2×3칸을 차지해서, 무엇을 넣을지 공간을 맞추는 것 자체가 게임이 됩니다.',
 vs:'모든 아이템이 한 칸씩 차지하는 보통 가방은 인벤토리 그리드(원칙 페이지)입니다.',
 t:'놓으려는 위치에 들어가면 초록, 겹치면 빨강으로 미리 보여 줍니다.',

{cat:'gpart',one:1,ko:'도감 실루엣',en:'Collection Silhouette',

{cat:'gpart',one:1,ko:'체력 구슬, 마나 구슬',en:'Resource Orb',
 d:'체력과 마나 같은 자원을 화면 아래 양쪽 구석의 둥근 유리구슬 속 액체 높이로 보여 주는 표시입니다. 디아블로 시리즈가 대표적이고, 액체 표면이 출렁이게 해서 살아 있는 느낌을 줍니다. 영어 이름 그대로 <b>오브(Orb), 리소스 오브</b>라고도 부릅니다.',
 ex:`<div class="gamebg" style="background:linear-gradient(#2a2030,#1a1420)">${[['left:14px','#e5484d','#8a1a1a',.72],['right:14px','#4c6ef5','#1a2a8a',.45]].map(([pos,a,b,v])=>`<div style="position:absolute;${pos};bottom:10px;width:58px;height:58px;border-radius:50%;overflow:hidden;background:#120c18;box-shadow:0 0 0 3px #c9a45a,inset 0 -4px 10px rgba(0,0,0,.6)"><div style="position:absolute;left:-10%;right:-10%;bottom:0;height:${v*100}%;background:linear-gradient(${a},${b});border-radius:40% 45% 0 0"></div><div style="position:absolute;left:10px;top:8px;width:18px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);transform:rotate(-25deg)"></div></div>`).join('')}<div style="position:absolute;left:86px;right:86px;bottom:14px;display:flex;gap:4px;justify-content:center">${[['#e5484d','sword'],['#3b5bdb','shield'],['#2f9e44','potion'],['#7048e8','gem']].map(([c,g])=>itm(c,g)).join('')}</div></div>`},
{cat:'web',one:1,mini:1,ko:'GNB',en:'Global Navigation Bar',d:'사이트 맨 위에 늘 있는 큰 메뉴 줄입니다.',g:'게임 로비 아래쪽이나 옆의 큰 메뉴 버튼 줄(로비 메뉴)이 같은 역할을 합니다.',
 ex:`<div class="scr" style="background:var(--msf)"><div style="display:flex;align-items:center;gap:14px;padding:8px 12px;border-bottom:1px solid var(--mln)"><b style="color:var(--mpri)">LOGO</b>${['소개','소식','커뮤니티','고객센터'].map((x,i)=>`<span style="${i==1?'color:var(--mpri);font-weight:700':''}">${x}</span>`).join('')}</div><div style="padding:12px" class="mut">본문</div></div>`},
{cat:'web',one:1,mini:1,ko:'LNB',en:'Local Navigation Bar',d:'고른 큰 메뉴 안의 하위 메뉴로, 주로 왼쪽에 세로로 놓입니다.',g:'상점, 가방 같은 화면 안의 왼쪽 탭이나 위쪽 탭으로 씁니다.',
 ex:`<div class="scr" style="background:var(--msf);display:grid;grid-template-columns:92px 1fr"><div style="border-right:1px solid var(--mln);padding:8px 0">${['공지사항','업데이트','이벤트','점검'].map((x,i)=>`<div style="padding:5px 12px;${i==1?'background:#e7ecff;color:var(--mpri);font-weight:700;box-shadow:inset 3px 0 0 var(--mpri)':''}">${x}</div>`).join('')}</div><div style="padding:12px"><b>업데이트</b><div class="mut" style="font-size:11px">10월 27일 패치 노트</div></div></div>`},
{cat:'web',one:1,mini:1,ko:'브레드크럼',en:'Breadcrumb',d:'"홈 > 상점 > 무기"처럼 지금 위치까지의 경로를 이어 보여 주는 표시입니다.',g:'거의 안 씁니다. 대신 왼쪽 위 뒤로 가기 버튼과 화면 제목으로 위치를 알려 줍니다.',
 ex:`<div class="scr" style="background:var(--msf);padding:14px"><div style="font-size:11.5px">${['홈','상점','무기','한손검'].map((x,i,a)=>`<span style="${i<a.length-1?'color:var(--mpri);text-decoration:underline':'font-weight:700'}">${x}</span>${i<a.length-1?'<span class="mut"> › </span>':''}`).join('')}</div><b style="display:block;font-size:16px;margin-top:10px">한손검</b></div>`},
{cat:'web',one:1,mini:1,ko:'햄버거 메뉴',en:'Hamburger Menu',d:'가로줄 세 개(≡) 아이콘입니다. 누르면 숨겨 둔 메뉴가 옆에서 열립니다.',g:'모바일 게임에서 가끔 씁니다. 보통은 자주 쓰는 메뉴를 숨기지 않고 아이콘으로 다 보여 줍니다.',
 ex:`<div class="scr" style="background:var(--msf)"><div style="position:absolute;left:0;top:0;bottom:0;width:120px;background:#1f2430;color:#fff;padding:12px;display:flex;flex-direction:column;gap:7px;font-size:11px"><b>메뉴</b><span>홈</span><span>상점</span><span>설정</span></div><div style="position:absolute;left:132px;top:10px;display:flex;flex-direction:column;gap:3px">${'<i style="display:block;width:20px;height:3px;border-radius:2px;background:var(--mink)"></i>'.repeat(3)}</div></div>`},
{cat:'web',one:1,mini:1,ko:'케밥 메뉴',en:'Kebab Menu',d:'세로 점 세 개(⋮) 아이콘입니다. 그 항목에만 해당하는 추가 기능 목록을 엽니다.',g:'친구 목록, 우편의 "더 보기"처럼 항목별 추가 기능에 가끔 씁니다.',

{cat:'web',one:1,mini:1,ko:'미트볼 메뉴',en:'Meatball Menu',d:'가로 점 세 개(⋯) 아이콘입니다. 케밥 메뉴를 가로로 눕힌 것입니다.',g:'케밥 메뉴와 같은 자리에 가끔 씁니다.',

{cat:'web',one:1,mini:1,ko:'벤토 메뉴',en:'Bento Menu',d:'점 아홉 개 격자 아이콘입니다. 같은 회사의 여러 앱이나 서비스 목록을 엽니다.',g:'거의 안 씁니다. 게임에서는 "전체 메뉴" 버튼이 비슷한 역할입니다.',

const cats=document.getElementById('cats'),main=document.getElementById('main');
const PAGE=1;
let lastPart=PAGE;  // 한 페이지에 한 파트만 있어서 파트 제목은 넣지 않는다
CATS.filter(c=>c.part===PAGE).forEach(c=>{if(c.part!==lastPart){lastPart=c.part;const g=document.createElement('span');g.className='grp';g.textContent=PARTS[c.part][0];cats.appendChild(g);const h=document.createElement('h2');h.className='part';h.id='part'+c.part;h.innerHTML=`${PARTS[c.part][0]}<small>${PARTS[c.part][1]}</small>`;main.appendChild(h);const l=document.createElement('p');l.className='lead';l.textContent=PARTS[c.part][2];main.appendChild(l)}
  const a=document.createElement('a');a.href='#'+c.id;a.textContent=c.name;cats.appendChild(a);
  const sec=document.createElement('section');sec.id=c.id;sec.innerHTML=`<h2>${c.name}<small>${c.en}</small></h2>${c.lead?`<p class="lead" style="color:var(--muted);margin:-6px 0 14px;max-width:62ch">${c.lead}</p>`:''}<div class="grid${c.mini?' mini':''}"></div>`;const grid=sec.querySelector('.grid');
  TERMS.filter(t=>t.cat===c.id).forEach(t=>{const card=document.createElement('article');card.className='card'+(t.mini?' mini':'')+(t.cat==='game'||t.cat==='gpart'?' ingame':'');
   card.innerHTML=t.mini?`<h3>${t.ko}<span class="en">${t.en}</span></h3><div class="stage wide" data-w="320" aria-label="${t.ko} 예시"><div class="mock" style="width:320px;height:180px">${t.ex}</div></div><p>${t.d}</p><p class="tip"><strong>게임에서는</strong> ${t.g}</p>`:t.one?`<h3>${t.ko}<span class="en">${t.en}</span></h3><div class="stage wide" data-w="320" aria-label="${t.ko} 예시"><div class="mock" style="width:320px;height:180px">${t.ex}</div></div><p>${t.d}</p>${t.vs?`<p class="tip"><strong>헷갈리는 것</strong> ${t.vs}</p>`:''}${t.t?`<p class="tip"><strong>팁</strong> ${t.t}</p>`:''}`:`<h3>${t.ko}<span class="en">${t.en}</span></h3><div class="pair"><figure><div class="stage" aria-label="${t.ko} 적용 전"><div class="mock">${t.b_}</div></div><figcaption><b>BEFORE</b>${t.b}</figcaption></figure><figure class="after"><div class="stage" aria-label="${t.ko} 적용 후"><div class="mock">${t.a_}</div></div><figcaption><b>AFTER</b>${t.a}</figcaption></figure></div><p>${t.d}</p>${t.vs?`<p class="tip"><strong>헷갈리는 것</strong> ${t.vs}</p>`:''}${t.t?`<p class="tip"><strong>팁</strong> ${t.t}</p>`:''}`;
   grid.appendChild(card)});main.appendChild(sec)});
// 예시는 280×210 크기로 그리고, 칸 폭에 맞춰 통째로 확대한다

// 눌러 볼 수 있는 예시: 탭, 스테퍼, 칩
document.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){const box=tb.closest('[data-tabs]');box.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b===tb));box.querySelectorAll('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==tb.dataset.tab)}
 const st=e.target.closest('[data-step]');if(st){const box=st.closest('[data-stepper]'),v=box.querySelector('[data-val]'),n=Math.max(1,Math.min(99,+v.textContent+ +st.dataset.step));v.textContent=n;box.querySelector('[data-total]').textContent=(n*+box.dataset.price).toLocaleString('ko-KR')}
 const ch=e.target.closest('[data-chip]');if(ch)ch.classList.toggle('on')});

// 숫자가 바뀌는 예시(쿨다운, 진행률, 카운트업)는 시간에 맞춰 글자만 바꾼다
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{const t=performance.now()/1000;
  document.querySelectorAll('[data-cd]').forEach(e=>{e.textContent=Math.max(1,Math.ceil(4-(t%4)))});
  document.querySelectorAll('[data-prog]').forEach(e=>{e.textContent=Math.round(Math.min(1,(t%4)/3.4)*100)+'%'});
  document.querySelectorAll('[data-count]').forEach(e=>{const u=t%3,roll=e.dataset.count==='roll',k=u<1?0:roll?Math.min(1,(u-1)/.7):1,v=Math.round(1200+300*(roll?1-(1-k)**3:k));e.textContent=v.toLocaleString('ko-KR');e.style.transform=roll&&u>1&&u<1.75?'scale(1.12)':'none';e.style.color=roll&&u>1&&u<1.9?'var(--mgold)':''})},50);
const fit=st=>st.style.setProperty('--s',st.clientWidth/(+st.dataset.w||280));const ro=new ResizeObserver(es=>es.forEach(e=>fit(e.target)));document.querySelectorAll('.stage').forEach(st=>{fit(st);ro.observe(st)});
</script>
